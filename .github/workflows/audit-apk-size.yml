name: Audit APK Size

# ============================================================================
# AXEV CRIME — Auditoria Profunda do Tamanho do APK Android
# ============================================================================
# COMO USAR: GitHub Actions → "Audit APK Size" → Run workflow
#
# GARANTIAS:
#   • Não apaga, modifica nem commita nada no repositório.
#   • O APK gerado serve exclusivamente para auditoria.
#   • Nenhum artefacto anterior é eliminado.
# ============================================================================

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Auditoria completa do APK Android
    runs-on: ubuntu-22.04
    timeout-minutes: 75

    env:
      GLB_SOLDIER:    "assets/models/character/protagonist/The_Soldier.glb"
      GLB_ANIMATIONS: "assets/models/character/animations.glb"
      APK_PATH:       "build/android/axev_crime_audit.apk"
      REPORT_MD:      "/tmp/audit-report.md"
      REPORT_JSON:    "/tmp/audit-report.json"

    steps:
      # ════════════════════════════════════════════════════════════════
      # 1. CHECKOUT
      # ════════════════════════════════════════════════════════════════
      - name: Checkout repositório
        uses: actions/checkout@v4

      # ════════════════════════════════════════════════════════════════
      # 2. JAVA 17 (igual ao build-android.yml)
      # ════════════════════════════════════════════════════════════════
      - name: Confirmar Java 17
        run: |
          java -version
          JAVA_PATH="$(readlink -f "$(which java)")"
          JAVA_HOME_DETECTED="$(dirname "$(dirname "$JAVA_PATH")")"
          echo "JAVA_HOME_DETECTED=$JAVA_HOME_DETECTED" >> "$GITHUB_ENV"
          echo "Java home: $JAVA_HOME_DETECTED"

      # ════════════════════════════════════════════════════════════════
      # 3. DEPENDÊNCIAS DO SISTEMA (igual ao build-android.yml + extras auditoria)
      # ════════════════════════════════════════════════════════════════
      - name: Instalar dependências do sistema
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            wget unzip ca-certificates \
            libfontconfig1 libx11-6 libxext6 \
            libxrender1 libxi6 libxrandr2 \
            libxcursor1 libxinerama1 libgl1 \
            python3 xxd aapt

      # ════════════════════════════════════════════════════════════════
      # 4. GODOT 4.3 (igual ao build-android.yml)
      # ════════════════════════════════════════════════════════════════
      - name: Instalar Godot 4.3
        run: |
          set -euo pipefail
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 \
            /tmp/godot/Godot_v4.3-stable_linux.x86_64 \
            /usr/local/bin/godot
          godot --version

      # ════════════════════════════════════════════════════════════════
      # 5. TEMPLATES DE EXPORTAÇÃO GODOT 4.3 (igual ao build-android.yml)
      # ════════════════════════════════════════════════════════════════
      - name: Instalar templates de exportação Godot 4.3
        run: |
          set -euo pipefail
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -O /tmp/templates.tpz
          mkdir -p /tmp/templates_extracted
          unzip -q /tmp/templates.tpz -d /tmp/templates_extracted
          TEMPLATE_SRC="$(find /tmp/templates_extracted -type d -name "templates" | head -1)"
          if [[ -z "$TEMPLATE_SRC" ]]; then
            echo "::error::Directório de templates não encontrado no arquivo"
            exit 1
          fi
          mkdir -p "$TEMPLATES_DIR"
          cp -r "$TEMPLATE_SRC"/. "$TEMPLATES_DIR/"
          echo "Templates instalados: $(ls "$TEMPLATES_DIR" | wc -l) ficheiros"
          ls "$TEMPLATES_DIR/" | grep -i android || echo "AVISO: nenhum ficheiro android encontrado"

      # ════════════════════════════════════════════════════════════════
      # 6. ANDROID SDK (igual ao build-android.yml)
      # ════════════════════════════════════════════════════════════════
      - name: Localizar Android SDK
        run: |
          set -euo pipefail
          CANDIDATE="/usr/local/lib/android/sdk"
          if [[ ! -d "$CANDIDATE" ]]; then
            echo "::error::Android SDK não encontrado em $CANDIDATE"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$CANDIDATE" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$CANDIDATE" -name "sdkmanager" 2>/dev/null | head -1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager não encontrado"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version || true

      - name: Instalar build-tools e platform Android
        run: |
          set -euo pipefail
          "$SDKMANAGER" --licenses < /dev/null 2>&1 | grep -v "^$" | tail -5 || true
          "$SDKMANAGER" "build-tools;34.0.0" "platforms;android-34" \
            < /dev/null > /tmp/sdkmanager_install.log 2>&1
          SDK_EXIT=$?
          tail -10 /tmp/sdkmanager_install.log
          if [[ "$SDK_EXIT" -ne 0 ]]; then
            echo "::error::sdkmanager falhou (exit $SDK_EXIT)"
            cat /tmp/sdkmanager_install.log
            exit 1
          fi

      # ════════════════════════════════════════════════════════════════
      # 7. NDK (igual ao build-android.yml)
      # ════════════════════════════════════════════════════════════════
      - name: Localizar NDK pré-instalado
        run: |
          set -euo pipefail
          NDK_BASE="$ANDROID_SDK_ROOT/ndk"
          echo "NDKs disponíveis no runner:"
          ls "$NDK_BASE/" 2>/dev/null || echo "(nenhum)"
          if [[ -d "$NDK_BASE/23.2.8568313" ]]; then
            ANDROID_NDK_ROOT="$NDK_BASE/23.2.8568313"
          else
            ANDROID_NDK_ROOT="$(find "$NDK_BASE" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
            if [[ -z "$ANDROID_NDK_ROOT" ]]; then
              echo "::error::Nenhum NDK encontrado no runner"
              exit 1
            fi
          fi
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          cat "$ANDROID_NDK_ROOT/source.properties"

      # ════════════════════════════════════════════════════════════════
      # 8. KEYSTORE (igual ao build-android.yml — dois passos separados)
      # ════════════════════════════════════════════════════════════════
      - name: Gerar keystore de debug temporária
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          KEYSTORE_PATH="$HOME/.android/debug.keystore"
          keytool -genkey -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Configurar variáveis de keystore Android
        run: |
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE_PATH"  >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"     >> "$GITHUB_ENV"

      # ════════════════════════════════════════════════════════════════
      # 9. AUDITORIA DO PROJECTO (ficheiros versionados)
      # ════════════════════════════════════════════════════════════════
      - name: "AUDITORIA 1/5 — Projecto (ficheiros versionados)"
        run: |
          set -euo pipefail
          echo "════════════════════════════════════════════════════════════"
          echo "  AUDITORIA DO PROJECTO"
          echo "════════════════════════════════════════════════════════════"

          TOTAL_SIZE=$(du -sb . \
            --exclude='.git' --exclude='.godot' --exclude='build' \
            2>/dev/null | tail -1 | cut -f1)
          TOTAL_FILES=$(find . \
            -not -path './.git/*' -not -path './.godot/*' -not -path './build/*' \
            -type f | wc -l)

          echo "Total ficheiros : $TOTAL_FILES"
          printf "Tamanho total   : %s bytes  (%.2f MiB)\n" \
            "$TOTAL_SIZE" "$(echo "$TOTAL_SIZE 1048576" | awk '{printf "%.2f", $1/$2}')"

          echo ""
          echo "── Os 20 maiores ficheiros ──────────────────────────────────"
          find . \
            -not -path './.git/*' -not -path './.godot/*' -not -path './build/*' \
            -type f -exec du -b {} + \
            | sort -rn | head -20 \
            | awk '{printf "  %10d bytes  (%6.2f MiB)  %s\n", $1, $1/1048576, $2}'

          find . \
            -not -path './.git/*' -not -path './.godot/*' -not -path './build/*' \
            -type f -exec du -b {} + \
            | sort -rn > /tmp/project_files_sorted.txt

          echo "PROJ_TOTAL_SIZE=$TOTAL_SIZE"   >> "$GITHUB_ENV"
          echo "PROJ_TOTAL_FILES=$TOTAL_FILES" >> "$GITHUB_ENV"

      # ════════════════════════════════════════════════════════════════
      # 10. AUDITORIA DOS GLBs
      # ════════════════════════════════════════════════════════════════
      - name: "AUDITORIA 2/5 — GLB (The_Soldier + animations)"
        run: |
          python3 << 'PYEOF'
          import struct, json, os, glob

          def audit_glb(path, label):
              print(f"\n{'═'*60}")
              print(f"  {label}")
              print(f"  {path}")
              print(f"{'═'*60}")

              if not os.path.exists(path):
                  print(f"  AUSENTE — ficheiro não encontrado")
                  return {"path": path, "present": False, "size_bytes": 0,
                          "animations": 0, "materials": 0, "images": 0,
                          "skins": 0, "nodes": 0, "meshes": 0,
                          "json_bytes": 0, "bin_bytes": 0, "bone_count": 0,
                          "anim_names": [], "images_embedded": 0, "images_external": 0}

              with open(path, "rb") as f:
                  raw = f.read()

              file_size = len(raw)
              magic, version, glb_len = struct.unpack_from("<III", raw, 0)
              valid = (magic == 0x46546C67)

              print(f"  Tamanho : {file_size:,} bytes  ({file_size/1048576:.2f} MiB)")
              print(f"  GLB     : {'válido' if valid else 'INVÁLIDO'}")

              if not valid:
                  return {"path": path, "present": True, "size_bytes": file_size,
                          "valid": False, "animations": 0, "materials": 0,
                          "images": 0, "skins": 0, "nodes": 0, "meshes": 0,
                          "json_bytes": 0, "bin_bytes": 0, "bone_count": 0,
                          "anim_names": [], "images_embedded": 0, "images_external": 0}

              chunk0_len = struct.unpack_from("<I", raw, 12)[0]
              json_bytes = chunk0_len
              gltf = json.loads(raw[20:20 + chunk0_len])

              bin_offset = 20 + chunk0_len
              bin_bytes = 0
              if bin_offset + 8 <= len(raw):
                  bin_bytes = struct.unpack_from("<I", raw, bin_offset)[0]

              nodes      = gltf.get("nodes", [])
              skins      = gltf.get("skins", [])
              animations = gltf.get("animations", [])
              materials  = gltf.get("materials", [])
              images     = gltf.get("images", [])
              meshes     = gltf.get("meshes", [])
              accessors  = gltf.get("accessors", [])

              print(f"  JSON chunk  : {json_bytes:,} bytes  ({json_bytes/1048576:.3f} MiB)")
              print(f"  BIN chunk   : {bin_bytes:,} bytes  ({bin_bytes/1048576:.2f} MiB)")
              print(f"  Nós         : {len(nodes)}")
              print(f"  Meshes      : {len(meshes)}")
              print(f"  Skins       : {len(skins)}")
              print(f"  Animações   : {len(animations)}")
              print(f"  Materiais   : {len(materials)}")
              print(f"  Imagens     : {len(images)}")

              ext_images = [i for i in images if "uri" in i and not i["uri"].startswith("data:")]
              emb_images = [i for i in images if "bufferView" in i]
              print(f"    ↳ incorporadas : {len(emb_images)}")
              print(f"    ↳ externas     : {len(ext_images)}")

              if animations:
                  print(f"\n  Animações ({len(animations)}):")
                  for a in animations:
                      ch = len(a.get("channels", []))
                      dur = 0.0
                      for s in a.get("samplers", []):
                          inp = s.get("input")
                          if inp is not None and inp < len(accessors):
                              mx = accessors[inp].get("max", [0])
                              v = mx[0] if isinstance(mx, list) else mx
                              if v > dur: dur = v
                      print(f"    [{a.get('name','?'):<45}]  {ch:3d}ch  {dur:.2f}s")

              if skins:
                  joints = skins[0].get("joints", [])
                  print(f"\n  Skeleton '{skins[0].get('name','?')}' — {len(joints)} bones")
                  for idx in joints[:6]:
                      if idx < len(nodes):
                          print(f"    {nodes[idx].get('name','?')}")
                  if len(joints) > 6:
                      print(f"    ... (+{len(joints)-6} bones)")

              return {
                  "path": path, "present": True, "valid": valid,
                  "size_bytes": file_size, "json_bytes": json_bytes, "bin_bytes": bin_bytes,
                  "nodes": len(nodes), "meshes": len(meshes), "skins": len(skins),
                  "bone_count": len(skins[0].get("joints",[])) if skins else 0,
                  "animations": len(animations), "materials": len(materials), "images": len(images),
                  "images_embedded": len(emb_images), "images_external": len(ext_images),
                  "anim_names": [a.get("name","?") for a in animations],
              }

          r_soldier = audit_glb(
              "assets/models/character/protagonist/The_Soldier.glb",
              "THE_SOLDIER.GLB — Protagonista principal")
          r_anims = audit_glb(
              "assets/models/character/animations.glb",
              "ANIMATIONS.GLB — Biblioteca externa")

          print(f"\n{'═'*60}")
          print(f"  REFERÊNCIAS NAS CENAS (.tscn)")
          print(f"{'═'*60}")

          scenes = glob.glob("scenes/*.tscn")
          refs_anims = []
          refs_animroot = []

          for scene_path in sorted(scenes):
              with open(scene_path, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()
              has_soldier = "The_Soldier.glb" in content
              has_anims   = "animations.glb"  in content
              has_root    = "AnimationRoot"    in content
              if has_anims:    refs_anims.append(scene_path)
              if has_root:     refs_animroot.append(scene_path)
              status = []
              if has_soldier: status.append("The_Soldier.glb ✓")
              if has_anims:   status.append("animations.glb ✓")
              if has_root:    status.append("AnimationRoot ✓")
              print(f"  {scene_path:<30}  {', '.join(status) or '(sem referências GLB)'}")

          if refs_anims:
              print(f"\n  ⚠ animations.glb referenciado em: {refs_anims}")
          else:
              print(f"\n  ✓ animations.glb NÃO é referenciado por nenhuma cena")

          for sp in refs_animroot:
              with open(sp, "r") as f:
                  lines = f.readlines()
              in_root = False
              visible = True
              for line in lines:
                  if 'name="AnimationRoot"' in line: in_root = True
                  if in_root and "visible = false" in line: visible = False; break
                  if in_root and line.strip().startswith("[node") and "AnimationRoot" not in line: in_root = False
              print(f"  AnimationRoot em {sp}: {'visible=true (ACTIVO)' if visible else 'visible=false (inactivo)'}")

          import json as jsonmod
          glb_data = {
              "soldier": r_soldier, "animations": r_anims,
              "scenes_referencing_animations_glb": refs_anims,
              "scenes_referencing_animation_root": refs_animroot,
          }
          with open("/tmp/glb_audit.json", "w") as f:
              jsonmod.dump(glb_data, f, indent=2)
          print("\n✓ /tmp/glb_audit.json guardado")
          PYEOF

      # ════════════════════════════════════════════════════════════════
      # 11. IMPORTAR RECURSOS (igual ao build-android.yml)
      # ════════════════════════════════════════════════════════════════
      - name: Importar recursos do projecto
        timeout-minutes: 8
        run: |
          set -euo pipefail
          timeout 420s godot \
            --headless --editor \
            --path "$GITHUB_WORKSPACE" \
            --import --quit 2>&1 | tee /tmp/godot_import.log
          status=${PIPESTATUS[0]}
          echo "--- Import log (últimas 30 linhas) ---"
          tail -30 /tmp/godot_import.log
          if grep -Eiq '^ERROR:|SCRIPT ERROR:|Parse Error:' /tmp/godot_import.log; then
            echo "::warning::Erros no import — a continuar"
          fi
          echo "Import concluído (exit: $status)"

      # ════════════════════════════════════════════════════════════════
      # 12. AUDITORIA .godot/imported
      # ════════════════════════════════════════════════════════════════
      - name: "AUDITORIA 3/5 — .godot/imported"
        run: |
          set -euo pipefail
          echo "════════════════════════════════════════════════════════════"
          echo "  .godot/imported"
          echo "════════════════════════════════════════════════════════════"

          IMPORTED_DIR=".godot/imported"
          if [[ ! -d "$IMPORTED_DIR" ]]; then
            echo "AVISO: pasta não existe"
            echo "IMPORTED_TOTAL_SIZE=0"  >> "$GITHUB_ENV"
            echo "IMPORTED_TOTAL_FILES=0" >> "$GITHUB_ENV"
            exit 0
          fi

          IMPORTED_SIZE=$(du -sb "$IMPORTED_DIR" 2>/dev/null | cut -f1)
          IMPORTED_FILES=$(find "$IMPORTED_DIR" -type f | wc -l)
          printf "Tamanho total  : %s bytes  (%.2f MiB)\n" \
            "$IMPORTED_SIZE" "$(echo "$IMPORTED_SIZE 1048576" | awk '{printf "%.2f", $1/$2}')"
          echo "Total ficheiros: $IMPORTED_FILES"

          echo ""
          echo "── Por extensão ─────────────────────────────────────────────"
          find "$IMPORTED_DIR" -type f | sed 's/.*\.//' | sort | uniq -c | sort -rn | \
            while read -r count ext; do
              SIZE=$(find "$IMPORTED_DIR" -type f -name "*.${ext}" -exec du -b {} + 2>/dev/null | \
                     awk '{s+=$1} END{printf "%d", s}')
              printf "  %5d  .%-10s  %10d bytes  (%6.2f MiB)\n" \
                "$count" "$ext" "$SIZE" "$(echo "$SIZE 1048576" | awk '{printf "%.2f", $1/$2}')"
            done

          echo ""
          echo "── Os 20 maiores ────────────────────────────────────────────"
          find "$IMPORTED_DIR" -type f -exec du -b {} + \
            | sort -rn | head -20 \
            | awk '{printf "  %10d bytes  (%6.2f MiB)  %s\n", $1, $1/1048576, $2}'

          echo ""
          echo "── Comparação original vs importado ─────────────────────────"
          for GLB in "$GLB_SOLDIER" "$GLB_ANIMATIONS"; do
            if [[ -f "$GLB" ]]; then
              ORIG_SIZE=$(wc -c < "$GLB")
              GLB_BASE=$(basename "$GLB" .glb)
              IMP_SIZE=$(find "$IMPORTED_DIR" -name "${GLB_BASE}*" -exec du -b {} + 2>/dev/null | \
                         awk '{s+=$1} END{printf "%d", s+0}')
              printf "  %-30s  orig: %10d B  imp: %10d B\n" \
                "$(basename "$GLB")" "$ORIG_SIZE" "$IMP_SIZE"
            fi
          done

          echo "IMPORTED_TOTAL_SIZE=$IMPORTED_SIZE"   >> "$GITHUB_ENV"
          echo "IMPORTED_TOTAL_FILES=$IMPORTED_FILES" >> "$GITHUB_ENV"
          find "$IMPORTED_DIR" -type f -exec du -b {} + \
            | sort -rn > /tmp/imported_files_sorted.txt

      # ════════════════════════════════════════════════════════════════
      # 13. EXPORTAR APK (igual ao build-android.yml)
      # ════════════════════════════════════════════════════════════════
      - name: Exportar APK de auditoria
        timeout-minutes: 20
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH:     ${{ env.GODOT_ANDROID_KEYSTORE_DEBUG_PATH }}
          GODOT_ANDROID_KEYSTORE_DEBUG_USER:     ${{ env.GODOT_ANDROID_KEYSTORE_DEBUG_USER }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: ${{ env.GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build/android

          echo "SDK : $ANDROID_SDK_ROOT"
          echo "NDK : $ANDROID_NDK_ROOT"
          echo "JDK : $JAVA_HOME_DETECTED"
          echo "KS  : $GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          echo ""

          timeout 900s godot \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android" \
            "$APK_PATH" \
            2>&1 | tee /tmp/godot_android_export.log
          status=${PIPESTATUS[0]}

          echo "--- Export log (últimas 60 linhas) ---"
          tail -60 /tmp/godot_android_export.log

          if [[ "$status" -ne 0 ]]; then
            echo "::error::Exportação Android falhou (exit $status)"
            exit 1
          fi

          if [[ ! -f "$APK_PATH" ]]; then
            echo "::error::APK não encontrado em $APK_PATH"
            ls -lh build/android/ 2>/dev/null || echo "(directório vazio)"
            exit 1
          fi

          APK_BYTES=$(wc -c < "$APK_PATH")
          HEX=$(xxd -l 2 -p "$APK_PATH")
          if [[ "$HEX" != "504b" ]]; then
            echo "::error::APK não é um ZIP válido (magic: $HEX)"
            exit 1
          fi

          printf "\n✓ APK gerado com sucesso\n  Tamanho : %d bytes  (%.2f MiB)\n" \
            "$APK_BYTES" "$(echo "$APK_BYTES 1048576" | awk '{printf "%.2f", $1/$2}')"
          echo "APK_SIZE_BYTES=$APK_BYTES" >> "$GITHUB_ENV"

      # ════════════════════════════════════════════════════════════════
      # 14. AUDITORIA DO APK INTERNO
      # ════════════════════════════════════════════════════════════════
      - name: "AUDITORIA 4/5 — APK interno"
        run: |
          set -euo pipefail
          APK="$APK_PATH"
          echo "════════════════════════════════════════════════════════════"
          echo "  APK INTERNO"
          echo "════════════════════════════════════════════════════════════"

          printf "Comprimido   : %d bytes  (%.2f MiB)\n" \
            "$APK_SIZE_BYTES" "$(echo "$APK_SIZE_BYTES 1048576" | awk '{printf "%.2f", $1/$2}')"

          UNCOMPRESSED=$(unzip -l "$APK" 2>/dev/null | tail -1 | awk '{print $1}')
          printf "Descomprimido: %s bytes  (%.2f MiB)\n" \
            "$UNCOMPRESSED" "$(echo "$UNCOMPRESSED 1048576" | awk '{printf "%.2f", $1/$2}')"

          unzip -l "$APK" > /tmp/apk_listing.txt 2>&1
          TOTAL_ENTRIES=$(grep -c "^\s*[0-9]" /tmp/apk_listing.txt || echo "0")
          echo "Entradas no APK: $TOTAL_ENTRIES"

          echo ""
          echo "── Os 20 maiores (descomprimidos) ───────────────────────────"
          grep -E "^\s+[0-9]" /tmp/apk_listing.txt \
            | awk '{print $1, $4}' | sort -rn | head -20 \
            | awk '{printf "  %10d bytes  (%6.2f MiB)  %s\n", $1, $1/1048576, $2}' \
            | tee /tmp/apk_top20.txt

          echo ""
          echo "── Por categoria ────────────────────────────────────────────"
          LIB_SIZE=$(grep -E "^\s+[0-9]" /tmp/apk_listing.txt | awk '{print $1, $4}' | \
            grep "^[0-9].* lib/" | awk '{s+=$1} END{printf "%d", s+0}')
          ASSETS_SIZE=$(grep -E "^\s+[0-9]" /tmp/apk_listing.txt | awk '{print $1, $4}' | \
            grep "^[0-9].* assets/" | awk '{s+=$1} END{printf "%d", s+0}')
          DEX_SIZE=$(grep -E "^\s+[0-9]" /tmp/apk_listing.txt | awk '{print $1, $4}' | \
            grep "^[0-9].*\.dex" | awk '{s+=$1} END{printf "%d", s+0}')

          printf "  lib/ (nativas)  : %10d bytes  (%6.2f MiB)\n" \
            "$LIB_SIZE" "$(echo "$LIB_SIZE 1048576" | awk '{printf "%.2f", $1/$2}')"
          printf "  assets/ (jogo)  : %10d bytes  (%6.2f MiB)\n" \
            "$ASSETS_SIZE" "$(echo "$ASSETS_SIZE 1048576" | awk '{printf "%.2f", $1/$2}')"
          printf "  *.dex (Android) : %10d bytes  (%6.2f MiB)\n" \
            "$DEX_SIZE" "$(echo "$DEX_SIZE 1048576" | awk '{printf "%.2f", $1/$2}')"

          echo ""
          echo "── animations.glb no APK? ───────────────────────────────────"
          if grep -q "animations" /tmp/apk_listing.txt; then
            echo "  ⚠ Encontrado:"
            grep "animations" /tmp/apk_listing.txt | head -5
          else
            echo "  Não encontrado directamente (pode estar no PCK)"
          fi

          echo ""
          echo "── Ficheiro PCK ─────────────────────────────────────────────"
          grep -iE "\.pck" /tmp/apk_listing.txt | head -5 || echo "  Nenhum .pck encontrado directamente"

          if command -v aapt &>/dev/null; then
            echo ""
            echo "── aapt dump ────────────────────────────────────────────────"
            aapt dump badging "$APK" 2>/dev/null | grep -E "^package:|^uses-sdk:" | head -5 || true
          fi

          echo "APK_LIB_SIZE=$LIB_SIZE"         >> "$GITHUB_ENV"
          echo "APK_ASSETS_SIZE=$ASSETS_SIZE"   >> "$GITHUB_ENV"
          echo "APK_DEX_SIZE=$DEX_SIZE"          >> "$GITHUB_ENV"
          echo "APK_UNCOMPRESSED=$UNCOMPRESSED"  >> "$GITHUB_ENV"

      # ════════════════════════════════════════════════════════════════
      # 15. DEPENDÊNCIAS — animations.glb no PCK
      # ════════════════════════════════════════════════════════════════
      - name: "AUDITORIA 5/5 — Dependências e animations.glb no APK"
        run: |
          set -euo pipefail
          echo "════════════════════════════════════════════════════════════"
          echo "  DEPENDÊNCIAS"
          echo "════════════════════════════════════════════════════════════"

          mkdir -p /tmp/apk_extracted
          unzip -q "$APK_PATH" -d /tmp/apk_extracted 2>/dev/null || true

          echo "── Estrutura interna ─────────────────────────────────────────"
          find /tmp/apk_extracted -maxdepth 2 -type d | sort | head -15

          echo ""
          echo "── Procurar animations.glb ───────────────────────────────────"
          FOUND_ANIMS=$(find /tmp/apk_extracted \
            \( -name "*animations*" -o -name "*anim*.glb" \) 2>/dev/null)
          if [[ -n "$FOUND_ANIMS" ]]; then
            echo "  ⚠ ENCONTRADO:"
            echo "$FOUND_ANIMS" | while read -r f; do
              printf "    %s  (%d bytes)\n" "$f" "$(wc -c < "$f")"
            done
            echo "ANIMS_IN_APK=true" >> "$GITHUB_ENV"
          else
            echo "  ✓ animations.glb NÃO encontrado como ficheiro separado"
            echo "ANIMS_IN_APK=false" >> "$GITHUB_ENV"
          fi

          echo ""
          echo "── PCK interno ───────────────────────────────────────────────"
          PCK_FILES=$(find /tmp/apk_extracted -name "*.pck" 2>/dev/null)
          if [[ -n "$PCK_FILES" ]]; then
            echo "$PCK_FILES" | while read -r pck; do
              printf "  %s  (%d bytes  / %.2f MiB)\n" \
                "$pck" "$(wc -c < "$pck")" \
                "$(echo "$(wc -c < "$pck") 1048576" | awk '{printf "%.2f", $1/$2}')"
              if strings "$pck" 2>/dev/null | grep -qi "animations"; then
                echo "    ⚠ PCK contém referência a 'animations'"
                strings "$pck" 2>/dev/null | grep -i "animations" | head -3
              else
                echo "    ✓ PCK sem referência a 'animations' (heurística)"
              fi
            done
          else
            echo "  Nenhum .pck encontrado nos assets"
          fi

          echo ""
          echo "── Bibliotecas nativas (.so) ─────────────────────────────────"
          find /tmp/apk_extracted/lib -name "*.so" 2>/dev/null | sort | while read -r lib; do
            printf "  %-55s  %8d bytes  (%5.2f MiB)\n" \
              "$(echo "$lib" | sed 's|/tmp/apk_extracted/||')" \
              "$(wc -c < "$lib")" \
              "$(echo "$(wc -c < "$lib") 1048576" | awk '{printf "%.2f", $1/$2}')"
          done

          echo ""
          echo "── export_presets.cfg ────────────────────────────────────────"
          grep -E "export_filter|exclude_filter|vram_texture" export_presets.cfg | head -10 || true

      # ════════════════════════════════════════════════════════════════
      # 16. GERAR RELATÓRIO
      # ════════════════════════════════════════════════════════════════
      - name: Gerar audit-report.md e audit-report.json
        if: always()
        run: |
          python3 << 'PYEOF'
          import json, os, datetime

          now = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")

          def envint(k):
              try: return int(os.environ.get(k, 0))
              except: return 0
          def mib(b):
              try: return f"{int(b)/1048576:.2f} MiB"
              except: return "N/D"
          def pct(v, t):
              try: return f"{int(v)*100/int(t):.1f}%" if int(t)>0 else "N/A"
              except: return "N/A"

          proj_size  = envint("PROJ_TOTAL_SIZE")
          proj_files = envint("PROJ_TOTAL_FILES")
          imp_size   = envint("IMPORTED_TOTAL_SIZE")
          imp_files  = envint("IMPORTED_TOTAL_FILES")
          apk_size   = envint("APK_SIZE_BYTES")
          apk_unc    = envint("APK_UNCOMPRESSED")
          apk_lib    = envint("APK_LIB_SIZE")
          apk_assets = envint("APK_ASSETS_SIZE")
          apk_dex    = envint("APK_DEX_SIZE")
          anims_in_apk = os.environ.get("ANIMS_IN_APK","false").lower() == "true"

          glb_data = {}
          if os.path.exists("/tmp/glb_audit.json"):
              with open("/tmp/glb_audit.json") as f:
                  glb_data = json.load(f)

          soldier  = glb_data.get("soldier", {})
          anims_glb = glb_data.get("animations", {})
          scenes_ref_anims = glb_data.get("scenes_referencing_animations_glb", [])

          def read_top20(path):
              lines = []
              if os.path.exists(path):
                  with open(path) as f:
                      for i, line in enumerate(f):
                          if i >= 20: break
                          parts = line.strip().split(None, 1)
                          if len(parts) == 2:
                              try:
                                  b, p = int(parts[0]), parts[1].lstrip("./")
                                  lines.append(f"| {i+1:2d} | `{p}` | {b:,} B | {mib(b)} |")
                              except: pass
              return lines

          apk_top20 = []
          if os.path.exists("/tmp/apk_top20.txt"):
              with open("/tmp/apk_top20.txt") as f:
                  apk_top20 = [l.rstrip() for l in f if l.strip()]

          md = [
              "# AXEV CRIME — Auditoria do APK Android",
              "",
              f"> **{now}** | Godot 4.3-stable | Android arm64-v8a",
              "> 🟢 MEDIDO  🟡 ESTIMADO  🔴 NÃO DISPONÍVEL",
              "",
              "---", "",
              "## A. Tamanho Real", "",
              "| Componente | Valor | Estado |",
              "| --- | --- | --- |",
          ]

          md.append(f"| Repositório | {proj_size:,} B ({mib(proj_size)}) — {proj_files} ficheiros | {'🟢 MEDIDO' if proj_size else '🔴'} |")
          md.append(f"| `.godot/imported` | {imp_size:,} B ({mib(imp_size)}) — {imp_files} ficheiros | {'🟢 MEDIDO' if imp_size else '🔴 não gerado'} |")
          md.append(f"| APK comprimido | {apk_size:,} B ({mib(apk_size)}) | {'🟢 MEDIDO' if apk_size else '🔴 falhou'} |")
          md.append(f"| APK descomprimido | {apk_unc:,} B ({mib(apk_unc)}) | {'🟢 MEDIDO' if apk_unc else '🔴'} |")
          md.append(f"| `lib/` nativas | {apk_lib:,} B ({mib(apk_lib)}) | {'🟢 MEDIDO' if apk_lib else '🔴'} |")
          md.append(f"| `assets/` jogo | {apk_assets:,} B ({mib(apk_assets)}) | {'🟢 MEDIDO' if apk_assets else '🔴'} |")
          md.append(f"| DEX | {apk_dex:,} B ({mib(apk_dex)}) | {'🟢 MEDIDO' if apk_dex else '🔴'} |")

          s_sz = soldier.get("size_bytes", 0)
          a_sz = anims_glb.get("size_bytes", 0)
          md.append(f"| `The_Soldier.glb` | {s_sz:,} B ({mib(s_sz)}) — {soldier.get('animations',0)} anim, {soldier.get('materials',0)} mat, {soldier.get('images',0)} img | {'🟢 MEDIDO' if s_sz else '🔴'} |")
          md.append(f"| `animations.glb` | {a_sz:,} B ({mib(a_sz)}) — {anims_glb.get('animations',0)} anim | {'🟢 MEDIDO' if a_sz else '🔴 ausente'} |")

          md += [
              "", "---", "",
              "## B. Os 20 Maiores Ficheiros do Projecto", "",
          ]
          p20 = read_top20("/tmp/project_files_sorted.txt")
          if p20:
              md += ["| # | Ficheiro | Bytes | MiB |", "| --- | --- | --- | --- |"] + p20
          else:
              md.append("🔴 Dados não disponíveis.")

          md += [
              "", "## B2. Os 20 Maiores Ficheiros no APK (descomprimido)", "",
              "```",
          ] + (apk_top20 if apk_top20 else ["🔴 APK não gerado."]) + ["```"]

          md += ["", "## B3. Os 20 Maiores Recursos Importados (.godot/imported)", ""]
          i20 = read_top20("/tmp/imported_files_sorted.txt")
          if i20:
              md += ["| # | Ficheiro | Bytes | MiB |", "| --- | --- | --- | --- |"] + i20
          else:
              md.append("🔴 Dados não disponíveis.")

          md += ["", "## B4. Distribuição do APK por Categoria", ""]
          if apk_unc > 0:
              rest = max(0, apk_unc - apk_lib - apk_assets - apk_dex)
              md += [
                  "| Categoria | MiB | % |",
                  "| --- | --- | --- |",
                  f"| `lib/` Bibliotecas Godot | {mib(apk_lib)} | {pct(apk_lib,apk_unc)} |",
                  f"| `assets/` Recursos do jogo | {mib(apk_assets)} | {pct(apk_assets,apk_unc)} |",
                  f"| DEX + infra Android | {mib(apk_dex)} | {pct(apk_dex,apk_unc)} |",
                  f"| Outros | {mib(rest)} | {pct(rest,apk_unc)} |",
                  f"| **TOTAL** | **{mib(apk_unc)}** | 100% |",
              ]
          else:
              md.append("🔴 APK não gerado.")

          md += [
              "", "---", "",
              "## C. animations.glb — Necessário?", "",
              f"- Tamanho: **{mib(a_sz)}**",
              f"- Referenciado em cenas: **{'Sim — ' + str(scenes_ref_anims) if scenes_ref_anims else 'Não'}**",
              f"- The_Soldier.glb tem **{soldier.get('animations',0)} animações incorporadas**",
              f"- Encontrado directamente no APK: **{'Sim ⚠' if anims_in_apk else 'Não (pode estar no PCK)'}**",
          ]
          if soldier.get("animations", 0) > 0 and not scenes_ref_anims:
              md.append(f"\n> **🟢 CONFIRMADO — animations.glb é redundante. Pode ser excluído do APK sem quebrar o jogo.**")
          else:
              md.append(f"\n> **🔴 NÃO CONFIRMADO — verificar antes de remover.**")

          md += [
              "", "---", "",
              "## D. Oportunidades de Redução de Tamanho", "",
              "| # | Acção | Poupança | Risco | Impacto no jogo |",
              "| --- | --- | --- | --- | --- |",
          ]
          if a_sz > 0:
              md.append(f"| 1 | Excluir `animations.glb` do APK | **{mib(a_sz)}** | 🟢 Nulo | 🟢 Nenhum |")
          md += [
              "| 2 | Desligar compressão de texturas desktop | ~2–5 MiB | 🟡 Baixo | 🟢 Nenhum |",
              "| 3 | Compressão Draco no GLB (Blender) | ~5–10 MiB | 🟠 Médio | 🟡 Verificar |",
              "| 4 | Remover animações não usadas (Blender) | ~5–15 MiB | 🔴 Alto | 🟡 Verificar |",
              "",
              "---",
              f"",
              f"*Gerado por `audit-apk-size.yml` em {now}. Nenhum ficheiro foi alterado.*",
          ]

          REPORT_MD = os.environ.get("REPORT_MD", "/tmp/audit-report.md")
          with open(REPORT_MD, "w") as f:
              f.write("\n".join(md))
          print(f"✓ {REPORT_MD}")

          report = {
              "meta": {"generated_at": now, "engine": "Godot 4.3-stable"},
              "project": {"size_bytes": proj_size, "size_mib": round(proj_size/1048576,2) if proj_size else None, "files": proj_files},
              "godot_imported": {"size_bytes": imp_size, "size_mib": round(imp_size/1048576,2) if imp_size else None, "files": imp_files},
              "apk": {
                  "compressed_bytes": apk_size, "compressed_mib": round(apk_size/1048576,2) if apk_size else None,
                  "uncompressed_bytes": apk_unc,
                  "lib_bytes": apk_lib, "assets_bytes": apk_assets, "dex_bytes": apk_dex,
              },
              "glb": {
                  "soldier": {"size_bytes": s_sz, "animations": soldier.get("animations",0),
                               "materials": soldier.get("materials",0), "images": soldier.get("images",0),
                               "bone_count": soldier.get("bone_count",0),
                               "anim_names": soldier.get("anim_names",[])},
                  "animations_glb": {"size_bytes": a_sz, "animations": anims_glb.get("animations",0)},
                  "animations_glb_in_apk": anims_in_apk,
                  "scenes_referencing_animations_glb": scenes_ref_anims,
              },
              "findings": {
                  "animations_glb_redundant": (a_sz > 0 and soldier.get("animations",0) > 0 and not scenes_ref_anims),
              },
          }

          REPORT_JSON = os.environ.get("REPORT_JSON", "/tmp/audit-report.json")
          with open(REPORT_JSON, "w") as f:
              json.dump(report, f, indent=2, ensure_ascii=False)
          print(f"✓ {REPORT_JSON}")
          PYEOF

      # ════════════════════════════════════════════════════════════════
      # 17. SUMÁRIO NO LOG
      # ════════════════════════════════════════════════════════════════
      - name: Sumário da auditoria
        if: always()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  AXEV CRIME — AUDITORIA APK — SUMÁRIO"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          [[ -n "${PROJ_TOTAL_SIZE:-}" && "${PROJ_TOTAL_SIZE}" -gt 0 ]] && \
            printf "  Projecto         : %.2f MiB  (%s ficheiros)\n" \
              "$(echo "$PROJ_TOTAL_SIZE 1048576" | awk '{printf "%.2f",$1/$2}')" "$PROJ_TOTAL_FILES"
          [[ -n "${IMPORTED_TOTAL_SIZE:-}" && "${IMPORTED_TOTAL_SIZE}" -gt 0 ]] && \
            printf "  .godot/imported  : %.2f MiB\n" \
              "$(echo "$IMPORTED_TOTAL_SIZE 1048576" | awk '{printf "%.2f",$1/$2}')"
          if [[ -n "${APK_SIZE_BYTES:-}" && "${APK_SIZE_BYTES}" -gt 0 ]]; then
            printf "  APK comprimido   : %.2f MiB\n" \
              "$(echo "$APK_SIZE_BYTES 1048576" | awk '{printf "%.2f",$1/$2}')"
            printf "  APK descomprimido: %.2f MiB\n" \
              "$(echo "$APK_UNCOMPRESSED 1048576" | awk '{printf "%.2f",$1/$2}')"
            printf "    lib/ nativas   : %.2f MiB\n" \
              "$(echo "$APK_LIB_SIZE 1048576" | awk '{printf "%.2f",$1/$2}')"
            printf "    assets/ jogo   : %.2f MiB\n" \
              "$(echo "$APK_ASSETS_SIZE 1048576" | awk '{printf "%.2f",$1/$2}')"
          else
            echo "  APK              : não gerado"
          fi
          echo "  animations.glb no APK: ${ANIMS_IN_APK:-desconhecido}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ════════════════════════════════════════════════════════════════
      # 18. UPLOAD RELATÓRIO
      # ════════════════════════════════════════════════════════════════
      - name: Upload — Relatório de auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-apk-report-${{ github.run_number }}
          path: |
            /tmp/audit-report.md
            /tmp/audit-report.json
          retention-days: 30
          if-no-files-found: warn

      # ════════════════════════════════════════════════════════════════
      # 19. UPLOAD APK
      # ════════════════════════════════════════════════════════════════
      - name: Upload — APK de auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-apk-android-${{ github.run_number }}
          path: build/android/axev_crime_audit.apk
          retention-days: 7
          if-no-files-found: warn

      # ════════════════════════════════════════════════════════════════
      # 20. UPLOAD LOGS
      # ════════════════════════════════════════════════════════════════
      - name: Upload — Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-logs-${{ github.run_number }}
          path: |
            /tmp/godot_import.log
            /tmp/godot_android_export.log
            /tmp/apk_listing.txt
            /tmp/project_files_sorted.txt
            /tmp/imported_files_sorted.txt
            /tmp/glb_audit.json
          retention-days: 7
          if-no-files-found: ignore
