name: Build Android APK (Debug)

# ── EXECUÇÃO APENAS MANUAL ─────────────────────────────────────────
# Nunca executa automaticamente em push ou pull_request.
# Para executar: GitHub → Actions → Build Android APK (Debug) → Run workflow
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Godot 4.3 — Android Debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # ── 1. CHECKOUT ────────────────────────────────────────────────
      - name: Checkout repositório
        uses: actions/checkout@v4

      # ── 2. JAVA (necessário para Android SDK e Godot Android export) ─
      - name: Verificar Java
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

      # ── 3. DEPENDÊNCIAS DO SISTEMA ─────────────────────────────────
      - name: Instalar dependências do sistema
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            wget unzip ca-certificates \
            libfontconfig1 libx11-6 libxext6 \
            libxrender1 libxi6 libxrandr2 \
            libxcursor1 libxinerama1 libgl1

      # ── 4. GODOT 4.3 ───────────────────────────────────────────────
      - name: Instalar Godot 4.3
        run: |
          set -euo pipefail
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 \
            /tmp/godot/Godot_v4.3-stable_linux.x86_64 \
            /usr/local/bin/godot
          godot --version

      # ── 5. TEMPLATES DE EXPORTAÇÃO GODOT ───────────────────────────
      - name: Instalar templates de exportação Godot 4.3
        run: |
          set -euo pipefail
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -O /tmp/templates.tpz
          mkdir -p /tmp/templates_extracted
          unzip -q /tmp/templates.tpz -d /tmp/templates_extracted
          TEMPLATE_SRC=$(find /tmp/templates_extracted -type d -name "templates" | head -1)
          if [[ -z "$TEMPLATE_SRC" ]]; then
            echo "::error::Directório de templates não encontrado"
            exit 1
          fi
          mkdir -p "$TEMPLATES_DIR"
          cp -r "$TEMPLATE_SRC"/. "$TEMPLATES_DIR/"
          echo "Templates instalados: $(ls "$TEMPLATES_DIR" | wc -l) ficheiros"
          # Verificar que templates Android estão presentes
          ls "$TEMPLATES_DIR/" | grep android || echo "AVISO: ficheiros android não encontrados nos templates"

      # ── 6. ANDROID SDK ─────────────────────────────────────────────
      # O runner ubuntu-22.04 já inclui o Android SDK em /usr/local/lib/android/sdk
      # mas pode estar incompleto. Vamos usar o cmdline-tools para instalar
      # exactamente o que o Godot 4.3 precisa.
      - name: Configurar Android SDK
        run: |
          set -euo pipefail

          # Usar SDK existente no runner se disponível
          if [[ -d "/usr/local/lib/android/sdk" ]]; then
            export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
            echo "Android SDK encontrado: $ANDROID_SDK_ROOT"
          else
            # Instalar SDK de raiz
            export ANDROID_SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$ANDROID_SDK_ROOT"
            wget -q \
              "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip" \
              -O /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extracted
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            mv /tmp/cmdline-tools-extracted/cmdline-tools \
               "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          # Verificar sdkmanager
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -f "$SDKMANAGER" ]]; then
            # Tentar localizar sdkmanager noutros caminhos conhecidos do runner
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT" -name "sdkmanager" 2>/dev/null | head -1)
          fi

          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager não encontrado"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "sdkmanager: $SDKMANAGER"

      - name: Instalar componentes Android necessários para Godot 4.3
        run: |
          set -euo pipefail

          # Aceitar licenças de forma não interactiva
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          # Godot 4.3 requer:
          #   build-tools 34.0.0
          #   platform android-34
          #   ndk 23.2.8568313 (r23c)
          yes | "$SDKMANAGER" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "ndk;23.2.8568313" \
            2>&1 | tail -5

          # Confirmar instalação
          ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/23.2.8568313"
          if [[ ! -d "$ANDROID_NDK_ROOT" ]]; then
            echo "::error::NDK não foi instalado correctamente"
            exit 1
          fi
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK instalado: $ANDROID_NDK_ROOT"

      # ── 7. KEYSTORE DE DEBUG ────────────────────────────────────────
      # O Android SDK gera automaticamente uma keystore de debug em
      # ~/.android/debug.keystore quando se faz a primeira compilação.
      # Vamos gerá-la manualmente para garantir que existe antes do Godot.
      - name: Gerar keystore de debug
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkey -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Keystore de debug gerada."
          else
            echo "Keystore de debug já existe."
          fi

      # ── 8. CONFIGURAR EDITOR SETTINGS DO GODOT ─────────────────────
      # O Godot lê as configurações do editor em:
      # ~/.config/godot/editor_settings-4.tres
      # É necessário definir os caminhos do SDK, NDK e JDK para que
      # a exportação Android funcione em modo headless.
      - name: Configurar editor settings do Godot para Android
        run: |
          set -euo pipefail

          GODOT_CONFIG_DIR="$HOME/.config/godot"
          mkdir -p "$GODOT_CONFIG_DIR"

          JAVA_HOME_DETECTED=$(dirname $(dirname $(readlink -f $(which java))))

          cat > "$GODOT_CONFIG_DIR/editor_settings-4.tres" << SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME_DETECTED"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          export/android/shutdown_adb_on_exit = true
          SETTINGS

          echo "Editor settings configurado:"
          cat "$GODOT_CONFIG_DIR/editor_settings-4.tres"

      # ── 9. IMPORTAR RECURSOS DO PROJECTO ───────────────────────────
      - name: Importar recursos do projecto
        timeout-minutes: 5
        run: |
          set -euo pipefail
          timeout 180s godot \
            --headless \
            --editor \
            --path "$GITHUB_WORKSPACE" \
            --import \
            --quit 2>&1 | tee /tmp/godot_import.log
          status=${PIPESTATUS[0]}

          echo "--- Godot import log (últimas 30 linhas) ---"
          tail -30 /tmp/godot_import.log

          if grep -Eiq \
            '(^ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource)' \
            /tmp/godot_import.log; then
            echo "::warning::Erros detectados durante o import — a continuar"
          fi

          echo "Import concluído (exit: $status)"

      # ── 10. EXPORTAR ANDROID DEBUG APK ─────────────────────────────
      - name: Exportar Android Debug APK
        timeout-minutes: 20
        run: |
          set -euo pipefail

          mkdir -p build/android

          echo "A iniciar exportação Android Debug..."
          timeout 900s godot \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android" \
            "build/android/axev_crime.apk" \
            2>&1 | tee /tmp/godot_android_export.log
          status=${PIPESTATUS[0]}

          echo "--- Godot Android export log (últimas 50 linhas) ---"
          tail -50 /tmp/godot_android_export.log

          if [[ "$status" -ne 0 ]]; then
            echo "::error::Exportação Android falhou com exit code $status"
            echo "--- Log completo ---"
            cat /tmp/godot_android_export.log
            exit 1
          fi

          if grep -Eiq \
            '(^ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource)' \
            /tmp/godot_android_export.log; then
            echo "::warning::Erros detectados nos logs de exportação Android"
          fi

          echo "Exportação Android concluída."

      # ── 11. VERIFICAR APK ──────────────────────────────────────────
      - name: Verificar APK gerado
        run: |
          set -euo pipefail

          APK="build/android/axev_crime.apk"

          if [[ ! -f "$APK" ]]; then
            echo "::error::APK não encontrado em $APK"
            echo "Conteúdo de build/android/:"
            ls -lh build/android/ 2>/dev/null || echo "(directório vazio ou inexistente)"
            exit 1
          fi

          APK_SIZE=$(wc -c < "$APK")
          echo "OK: $APK ($APK_SIZE bytes / $(du -sh "$APK" | cut -f1))"

          # Um APK válido começa com PK (ZIP signature 50 4B)
          HEX_MAGIC=$(xxd -l 2 -p "$APK")
          if [[ "$HEX_MAGIC" != "504b" ]]; then
            echo "::error::O ficheiro gerado não parece ser um ZIP/APK válido (magic: $HEX_MAGIC)"
            exit 1
          fi

          echo "Assinatura ZIP válida: OK"
          echo "APK pronto para download e instalação manual."

      # ── 12. UPLOAD DO APK COMO ARTIFACT ───────────────────────────
      - name: Upload APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: axev-crime-android-debug
          path: build/android/axev_crime.apk
          retention-days: 14
          if-no-files-found: error

      # ── 13. UPLOAD DOS LOGS COMO ARTIFACT (sempre) ─────────────────
      - name: Upload logs de exportação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-export-logs
          path: |
            /tmp/godot_import.log
            /tmp/godot_android_export.log
          retention-days: 7
          if-no-files-found: ignore

      # ── 14. SUMÁRIO ────────────────────────────────────────────────
      - name: Sumário da exportação
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  AXEV CRIME — Android Debug Build"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Godot:       4.3-stable"
          echo "  Plataforma:  Android (arm64-v8a)"
          echo "  Tipo:        Debug (keystore de debug automática)"
          echo "  APK:         build/android/axev_crime.apk"
          echo ""
          if [[ -f "build/android/axev_crime.apk" ]]; then
            echo "  RESULTADO:   APK GERADO"
            echo "  Tamanho:     $(du -sh build/android/axev_crime.apk | cut -f1)"
          else
            echo "  RESULTADO:   APK NÃO GERADO"
          fi
          echo ""
          echo "  Para instalar no Android:"
          echo "  1. Descarregar o artifact 'axev-crime-android-debug'"
          echo "  2. Activar 'Origens desconhecidas' nas definições"
          echo "  3. Instalar o APK directamente"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
