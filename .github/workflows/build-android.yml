name: Build Android APK (Debug)

# ── EXECUÇÃO APENAS MANUAL ─────────────────────────────────────────
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Godot 4.3 — Android Debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # ── 1. CHECKOUT ────────────────────────────────────────────────
      - name: Checkout repositório
        uses: actions/checkout@v4

      # ── 2. JAVA 17 ─────────────────────────────────────────────────
      - name: Confirmar Java 17
        run: |
          java -version
          JAVA_PATH="$(readlink -f "$(which java)")"
          JAVA_HOME_DETECTED="$(dirname "$(dirname "$JAVA_PATH")")"
          echo "JAVA_HOME_DETECTED=$JAVA_HOME_DETECTED" >> "$GITHUB_ENV"
          echo "Java home: $JAVA_HOME_DETECTED"

      # ── 3. DEPENDÊNCIAS DO SISTEMA ─────────────────────────────────
      - name: Instalar dependências do sistema
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            wget unzip ca-certificates \
            libfontconfig1 libx11-6 libxext6 \
            libxrender1 libxi6 libxrandr2 \
            libxcursor1 libxinerama1 libgl1

      # ── 4. GODOT 4.3 ───────────────────────────────────────────────
      - name: Instalar Godot 4.3
        run: |
          set -euo pipefail
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 \
            /tmp/godot/Godot_v4.3-stable_linux.x86_64 \
            /usr/local/bin/godot
          godot --version

      # ── 5. TEMPLATES DE EXPORTAÇÃO GODOT 4.3 ───────────────────────
      - name: Instalar templates de exportação Godot 4.3
        run: |
          set -euo pipefail
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -O /tmp/templates.tpz
          mkdir -p /tmp/templates_extracted
          unzip -q /tmp/templates.tpz -d /tmp/templates_extracted
          TEMPLATE_SRC="$(find /tmp/templates_extracted -type d -name "templates" | head -1)"
          if [[ -z "$TEMPLATE_SRC" ]]; then
            echo "::error::Directório de templates não encontrado no arquivo"
            exit 1
          fi
          mkdir -p "$TEMPLATES_DIR"
          cp -r "$TEMPLATE_SRC"/. "$TEMPLATES_DIR/"
          echo "Templates instalados: $(ls "$TEMPLATES_DIR" | wc -l) ficheiros"
          ls "$TEMPLATES_DIR/" | grep -i android || echo "AVISO: nenhum ficheiro android encontrado"

      # ── 6. ANDROID SDK — localizar o pré-instalado no runner ───────
      - name: Localizar Android SDK
        run: |
          set -euo pipefail

          CANDIDATE="/usr/local/lib/android/sdk"
          if [[ ! -d "$CANDIDATE" ]]; then
            echo "::error::Android SDK não encontrado em $CANDIDATE"
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$CANDIDATE" >> "$GITHUB_ENV"
          echo "Android SDK: $CANDIDATE"

          # Localizar sdkmanager
          SDKMANAGER="$(find "$CANDIDATE" -name "sdkmanager" 2>/dev/null | head -1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager não encontrado"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version || true

      # ── 7. BUILD TOOLS E PLATFORM ──────────────────────────────────
      # Instalar apenas build-tools e platform — SEM NDK via sdkmanager
      # para evitar o SIGPIPE causado por yes | sdkmanager | tail
      - name: Instalar build-tools e platform Android
        run: |
          set -euo pipefail

          # Aceitar licenças — sem pipe, redireccionando input directamente
          "$SDKMANAGER" --licenses < /dev/null 2>&1 | grep -v "^$" | tail -5 || true

          # Instalar build-tools e platform sem NDK (NDK já existe no runner)
          # Capturar exit code correctamente sem pipe para tail
          "$SDKMANAGER" "build-tools;34.0.0" "platforms;android-34" \
            < /dev/null > /tmp/sdkmanager_install.log 2>&1
          SDK_EXIT=$?

          tail -10 /tmp/sdkmanager_install.log

          if [[ "$SDK_EXIT" -ne 0 ]]; then
            echo "::error::sdkmanager falhou (exit $SDK_EXIT)"
            cat /tmp/sdkmanager_install.log
            exit 1
          fi

          echo "Build Tools e Platform instalados."
          ls "$ANDROID_SDK_ROOT/build-tools/" 2>/dev/null || true

      # ── 8. NDK — reutilizar o pré-instalado no runner ──────────────
      # O runner ubuntu-22.04 já inclui NDK 25.x ou 26.x
      # O Godot 4.3 é compatível com NDK >= 23
      - name: Localizar NDK pré-instalado
        run: |
          set -euo pipefail

          NDK_BASE="$ANDROID_SDK_ROOT/ndk"
          echo "NDKs disponíveis no runner:"
          ls "$NDK_BASE/" 2>/dev/null || echo "(nenhum)"

          # Preferir r23c se existir, senão usar o mais recente disponível
          if [[ -d "$NDK_BASE/23.2.8568313" ]]; then
            ANDROID_NDK_ROOT="$NDK_BASE/23.2.8568313"
            echo "NDK r23c encontrado."
          else
            # Usar o NDK mais recente pré-instalado (Godot 4.3 aceita >= r23)
            ANDROID_NDK_ROOT="$(find "$NDK_BASE" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
            if [[ -z "$ANDROID_NDK_ROOT" ]]; then
              echo "::error::Nenhum NDK encontrado no runner"
              exit 1
            fi
            echo "NDK pré-instalado encontrado: $ANDROID_NDK_ROOT"
          fi

          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK a usar: $ANDROID_NDK_ROOT"

          # Verificar que é um NDK válido
          if [[ ! -f "$ANDROID_NDK_ROOT/source.properties" ]]; then
            echo "::error::source.properties não encontrado — NDK inválido"
            exit 1
          fi
          cat "$ANDROID_NDK_ROOT/source.properties"

      # ── 9. KEYSTORE DE DEBUG ────────────────────────────────────────
      - name: Gerar keystore de debug temporária
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          KEYSTORE_PATH="$HOME/.android/debug.keystore"
          if [[ ! -f "$KEYSTORE_PATH" ]]; then
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Keystore gerada: $KEYSTORE_PATH"
          else
            echo "Keystore já existia: $KEYSTORE_PATH"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      # ── 10. KEYSTORE VIA VARIÁVEIS DE AMBIENTE ─────────────────────
      # Godot 4.3 lê nativamente GODOT_ANDROID_KEYSTORE_DEBUG_* em modo headless
      - name: Configurar variáveis de keystore Android
        run: |
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE_PATH"  >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"     >> "$GITHUB_ENV"
          echo "Variáveis de keystore configuradas."

      # ── 11. IMPORTAR RECURSOS DO PROJECTO ──────────────────────────
      - name: Importar recursos do projecto
        timeout-minutes: 5
        run: |
          set -euo pipefail
          timeout 180s godot \
            --headless \
            --editor \
            --path "$GITHUB_WORKSPACE" \
            --import \
            --quit 2>&1 | tee /tmp/godot_import.log
          status=${PIPESTATUS[0]}

          echo "--- Import log (últimas 20 linhas) ---"
          tail -20 /tmp/godot_import.log

          if grep -Eiq \
            '(^ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource)' \
            /tmp/godot_import.log; then
            echo "::warning::Erros detectados no import — a continuar"
          fi
          echo "Import concluído (exit: $status)"

      # ── 12. EXPORTAR ANDROID DEBUG APK ─────────────────────────────
      - name: Exportar Android Debug APK
        timeout-minutes: 20
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ env.GODOT_ANDROID_KEYSTORE_DEBUG_PATH }}
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: ${{ env.GODOT_ANDROID_KEYSTORE_DEBUG_USER }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: ${{ env.GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build/android

          echo "SDK:  $ANDROID_SDK_ROOT"
          echo "NDK:  $ANDROID_NDK_ROOT"
          echo "JDK:  $JAVA_HOME_DETECTED"
          echo "KS:   $GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          echo ""

          timeout 900s godot \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android" \
            "build/android/axev_crime.apk" \
            2>&1 | tee /tmp/godot_android_export.log
          status=${PIPESTATUS[0]}

          echo "--- Export log (últimas 60 linhas) ---"
          tail -60 /tmp/godot_android_export.log

          if [[ "$status" -ne 0 ]]; then
            echo "::error::Exportação Android falhou (exit $status)"
            exit 1
          fi
          echo "Exportação Android concluída."

      # ── 13. VERIFICAR APK ──────────────────────────────────────────
      - name: Verificar APK gerado
        run: |
          set -euo pipefail
          APK="build/android/axev_crime.apk"

          if [[ ! -f "$APK" ]]; then
            echo "::error::APK não encontrado: $APK"
            ls -lh build/android/ 2>/dev/null || echo "(directório vazio)"
            exit 1
          fi

          APK_SIZE=$(wc -c < "$APK")
          if [[ "$APK_SIZE" -lt 1000 ]]; then
            echo "::error::APK tem apenas $APK_SIZE bytes — corrompido"
            exit 1
          fi

          HEX_MAGIC=$(xxd -l 2 -p "$APK")
          if [[ "$HEX_MAGIC" != "504b" ]]; then
            echo "::error::Não é um ZIP/APK válido (magic: $HEX_MAGIC)"
            exit 1
          fi

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  APK VERIFICADO COM SUCESSO"
          echo "  Tamanho: $(du -sh "$APK" | cut -f1)"
          echo "  Magic:   $HEX_MAGIC (ZIP válido)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ── 14. UPLOAD APK COMO ARTIFACT DESCARREGÁVEL ─────────────────
      - name: Upload APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: axev-crime-android-debug
          path: build/android/axev_crime.apk
          retention-days: 14
          if-no-files-found: error

      # ── 15. LOGS SEMPRE GUARDADOS ──────────────────────────────────
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-export-logs
          path: |
            /tmp/godot_import.log
            /tmp/godot_android_export.log
            /tmp/sdkmanager_install.log
          retention-days: 7
          if-no-files-found: ignore

      # ── 16. SUMÁRIO ────────────────────────────────────────────────
      - name: Sumário da exportação
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  AXEV CRIME — Android Debug Build"
          echo "  Godot:  4.3-stable | SDK: API 34 | NDK: $ANDROID_NDK_ROOT"
          if [[ -f "build/android/axev_crime.apk" ]]; then
            echo "  RESULTADO: ✓ APK GERADO ($(du -sh build/android/axev_crime.apk | cut -f1))"
          else
            echo "  RESULTADO: ✗ APK NÃO GERADO"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
