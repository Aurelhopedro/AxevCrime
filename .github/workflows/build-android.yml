name: Build Android APK + PCK (Debug)

# ── EXECUÇÃO APENAS MANUAL ─────────────────────────────────────────
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Godot 4.3 — Android Debug APK + PCK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # ── 1. CHECKOUT ────────────────────────────────────────────────
      - name: Checkout repositório
        uses: actions/checkout@v4

      # ── 2. VERIFICAR PERSONAGEM PRINCIPAL ──────────────────────────
      # Build falha imediatamente se The_Soldier.glb não estiver presente.
      - name: Verificar The_Soldier.glb (personagem principal)
        run: |
          set -euo pipefail
          MISSING=0

          if [[ ! -f "assets/models/character/protagonist/The_Soldier.glb" ]]; then
            echo "::error::The_Soldier.glb não encontrado em assets/models/character/protagonist/"
            echo "  Este ficheiro é o personagem principal do AXEV CRIME."
            echo "  Deve ser colocado manualmente ou via workflow de importação."
            MISSING=1
          else
            SIZE=$(du -sh "assets/models/character/protagonist/The_Soldier.glb" | cut -f1)
            HEX=$(xxd -l 4 -p "assets/models/character/protagonist/The_Soldier.glb")
            if [[ "$HEX" == "676c5446" ]]; then
              echo "✓ The_Soldier.glb — ${SIZE} — GLB válido"
            else
              echo "::warning::The_Soldier.glb encontrado mas magic bytes inesperados: $HEX"
            fi
          fi

          # animations.glb é opcional (AnimationPlayer pode estar no GLB do personagem)
          if [[ -f "assets/models/character/animations.glb" ]]; then
            echo "✓ animations.glb ($(du -sh assets/models/character/animations.glb | cut -f1)) — biblioteca de animações"
          else
            echo "⚠ animations.glb ausente — usando animações incorporadas em The_Soldier.glb (se existirem)"
          fi

          if [[ "$MISSING" -eq 1 ]]; then
            echo ""
            echo "INSTRUÇÕES: colocar The_Soldier.glb em assets/models/character/protagonist/"
            exit 1
          fi
          echo "Assets do personagem verificados."

      # ── 3. JAVA 17 ─────────────────────────────────────────────────
      - name: Confirmar Java 17
        run: |
          java -version
          JAVA_PATH="$(readlink -f "$(which java)")"
          JAVA_HOME_DETECTED="$(dirname "$(dirname "$JAVA_PATH")")"
          echo "JAVA_HOME_DETECTED=$JAVA_HOME_DETECTED" >> "$GITHUB_ENV"
          echo "Java home: $JAVA_HOME_DETECTED"

      # ── 4. DEPENDÊNCIAS DO SISTEMA ─────────────────────────────────
      - name: Instalar dependências do sistema
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            wget unzip ca-certificates \
            libfontconfig1 libx11-6 libxext6 \
            libxrender1 libxi6 libxrandr2 \
            libxcursor1 libxinerama1 libgl1

      # ── 5. GODOT 4.3 ───────────────────────────────────────────────
      - name: Instalar Godot 4.3
        run: |
          set -euo pipefail
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 \
            /tmp/godot/Godot_v4.3-stable_linux.x86_64 \
            /usr/local/bin/godot
          godot --version

      # ── 6. TEMPLATES DE EXPORTAÇÃO GODOT 4.3 ───────────────────────
      - name: Instalar templates de exportação Godot 4.3
        run: |
          set -euo pipefail
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -O /tmp/templates.tpz
          mkdir -p /tmp/templates_extracted
          unzip -q /tmp/templates.tpz -d /tmp/templates_extracted
          TEMPLATE_SRC="$(find /tmp/templates_extracted -type d -name "templates" | head -1)"
          if [[ -z "$TEMPLATE_SRC" ]]; then
            echo "::error::Directório de templates não encontrado no arquivo"
            exit 1
          fi
          mkdir -p "$TEMPLATES_DIR"
          cp -r "$TEMPLATE_SRC"/. "$TEMPLATES_DIR/"
          echo "Templates instalados: $(ls "$TEMPLATES_DIR" | wc -l) ficheiros"
          ls "$TEMPLATES_DIR/" | grep -i android || echo "AVISO: nenhum ficheiro android encontrado"

      # ── 7. ANDROID SDK — localizar o pré-instalado no runner ───────
      - name: Localizar Android SDK
        run: |
          set -euo pipefail

          CANDIDATE="/usr/local/lib/android/sdk"
          if [[ ! -d "$CANDIDATE" ]]; then
            echo "::error::Android SDK não encontrado em $CANDIDATE"
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$CANDIDATE" >> "$GITHUB_ENV"
          echo "Android SDK: $CANDIDATE"

          SDKMANAGER="$(find "$CANDIDATE" -name "sdkmanager" 2>/dev/null | head -1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager não encontrado"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version || true

      # ── 8. BUILD TOOLS E PLATFORM ──────────────────────────────────
      - name: Instalar build-tools e platform Android
        run: |
          set -euo pipefail
          "$SDKMANAGER" --licenses < /dev/null 2>&1 | grep -v "^$" | tail -5 || true
          "$SDKMANAGER" "build-tools;34.0.0" "platforms;android-34" \
            < /dev/null > /tmp/sdkmanager_install.log 2>&1
          SDK_EXIT=$?
          tail -10 /tmp/sdkmanager_install.log
          if [[ "$SDK_EXIT" -ne 0 ]]; then
            echo "::error::sdkmanager falhou (exit $SDK_EXIT)"
            cat /tmp/sdkmanager_install.log
            exit 1
          fi
          echo "Build Tools e Platform instalados."

      # ── 9. NDK — reutilizar o pré-instalado no runner ──────────────
      - name: Localizar NDK pré-instalado
        run: |
          set -euo pipefail
          NDK_BASE="$ANDROID_SDK_ROOT/ndk"
          echo "NDKs disponíveis no runner:"
          ls "$NDK_BASE/" 2>/dev/null || echo "(nenhum)"

          if [[ -d "$NDK_BASE/23.2.8568313" ]]; then
            ANDROID_NDK_ROOT="$NDK_BASE/23.2.8568313"
            echo "NDK r23c encontrado."
          else
            ANDROID_NDK_ROOT="$(find "$NDK_BASE" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
            if [[ -z "$ANDROID_NDK_ROOT" ]]; then
              echo "::error::Nenhum NDK encontrado no runner"
              exit 1
            fi
            echo "NDK pré-instalado encontrado: $ANDROID_NDK_ROOT"
          fi

          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK a usar: $ANDROID_NDK_ROOT"

          if [[ ! -f "$ANDROID_NDK_ROOT/source.properties" ]]; then
            echo "::error::source.properties não encontrado — NDK inválido"
            exit 1
          fi
          cat "$ANDROID_NDK_ROOT/source.properties"

      # ── 10. KEYSTORE DE DEBUG ───────────────────────────────────────
      - name: Gerar keystore de debug temporária
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          KEYSTORE_PATH="$HOME/.android/debug.keystore"
          if [[ ! -f "$KEYSTORE_PATH" ]]; then
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Keystore gerada: $KEYSTORE_PATH"
          else
            echo "Keystore já existia: $KEYSTORE_PATH"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      # ── 11. KEYSTORE VIA VARIÁVEIS DE AMBIENTE ─────────────────────
      - name: Configurar variáveis de keystore Android
        run: |
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE_PATH"  >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"     >> "$GITHUB_ENV"
          echo "Variáveis de keystore configuradas."

      # ── 12. IMPORTAR RECURSOS DO PROJECTO ──────────────────────────
      - name: Importar recursos do projecto
        timeout-minutes: 8
        run: |
          set -euo pipefail
          timeout 420s godot \
            --headless \
            --editor \
            --path "$GITHUB_WORKSPACE" \
            --import \
            --quit 2>&1 | tee /tmp/godot_import.log
          status=${PIPESTATUS[0]}

          echo "--- Import log (últimas 30 linhas) ---"
          tail -30 /tmp/godot_import.log

          if grep -Eiq \
            '(^ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource)' \
            /tmp/godot_import.log; then
            echo "::warning::Erros detectados no import — a continuar"
          fi
          echo "Import concluído (exit: $status)"

      # ── 13. EXPORTAR ANDROID DEBUG APK ─────────────────────────────
      - name: Exportar Android Debug APK
        timeout-minutes: 20
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ env.GODOT_ANDROID_KEYSTORE_DEBUG_PATH }}
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: ${{ env.GODOT_ANDROID_KEYSTORE_DEBUG_USER }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: ${{ env.GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build/android

          echo "SDK:  $ANDROID_SDK_ROOT"
          echo "NDK:  $ANDROID_NDK_ROOT"
          echo "JDK:  $JAVA_HOME_DETECTED"
          echo "KS:   $GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          echo ""

          timeout 900s godot \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android" \
            "build/android/axev_crime.apk" \
            2>&1 | tee /tmp/godot_android_export.log
          status=${PIPESTATUS[0]}

          echo "--- Export log (últimas 60 linhas) ---"
          tail -60 /tmp/godot_android_export.log

          if [[ "$status" -ne 0 ]]; then
            echo "::error::Exportação Android APK falhou (exit $status)"
            exit 1
          fi
          echo "Exportação APK concluída."

      # ── 14. VERIFICAR APK ──────────────────────────────────────────
      - name: Verificar APK gerado
        run: |
          set -euo pipefail
          APK="build/android/axev_crime.apk"

          if [[ ! -f "$APK" ]]; then
            echo "::error::APK não encontrado: $APK"
            ls -lh build/android/ 2>/dev/null || echo "(directório vazio)"
            exit 1
          fi

          APK_SIZE=$(wc -c < "$APK")
          if [[ "$APK_SIZE" -lt 1000 ]]; then
            echo "::error::APK tem apenas $APK_SIZE bytes — corrompido"
            exit 1
          fi

          HEX_MAGIC=$(xxd -l 2 -p "$APK")
          if [[ "$HEX_MAGIC" != "504b" ]]; then
            echo "::error::Não é um ZIP/APK válido (magic: $HEX_MAGIC)"
            exit 1
          fi

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  APK VERIFICADO"
          echo "  Tamanho: $(du -sh "$APK" | cut -f1)"
          echo "  Magic:   $HEX_MAGIC (ZIP válido)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ── 15. EXPORTAR PCK (arquivo Godot) ───────────────────────────
      # O PCK é o pacote de recursos do jogo — útil para:
      #   • Distribuir actualizações de conteúdo sem reinstalar o APK
      #   • Testar o projecto no Godot Editor noutra máquina
      #   • Futuras plataformas (PC, iOS) que partilham os mesmos assets
      - name: Exportar PCK (arquivo Godot)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p build/pck

          timeout 480s godot \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-pack "Android" \
            "build/pck/axev_crime.pck" \
            2>&1 | tee /tmp/godot_pck_export.log
          status=${PIPESTATUS[0]}

          echo "--- PCK export log (últimas 30 linhas) ---"
          tail -30 /tmp/godot_pck_export.log

          if [[ "$status" -ne 0 ]]; then
            echo "::error::Exportação PCK falhou (exit $status)"
            exit 1
          fi
          echo "Exportação PCK concluída."

      # ── 16. VERIFICAR PCK ──────────────────────────────────────────
      - name: Verificar PCK gerado
        run: |
          set -euo pipefail
          PCK="build/pck/axev_crime.pck"

          if [[ ! -f "$PCK" ]]; then
            echo "::error::PCK não encontrado: $PCK"
            ls -lh build/pck/ 2>/dev/null || echo "(directório vazio)"
            exit 1
          fi

          PCK_SIZE=$(wc -c < "$PCK")
          if [[ "$PCK_SIZE" -lt 100 ]]; then
            echo "::error::PCK tem apenas $PCK_SIZE bytes — corrompido"
            exit 1
          fi

          # Magic bytes de um PCK Godot 4: 47 44 50 43 = "GDPC"
          HEX_MAGIC=$(xxd -l 4 -p "$PCK")
          if [[ "$HEX_MAGIC" == "47445043" ]]; then
            echo "✓ Magic GDPC — PCK Godot válido"
          else
            echo "::warning::Magic bytes inesperados: $HEX_MAGIC (pode ainda ser válido)"
          fi

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  PCK VERIFICADO"
          echo "  Tamanho: $(du -sh "$PCK" | cut -f1)"
          echo "  Magic:   $HEX_MAGIC"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ── 17. UPLOAD APK COMO ARTIFACT ───────────────────────────────
      - name: Upload APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: axev-crime-android-debug
          path: build/android/axev_crime.apk
          retention-days: 14
          if-no-files-found: error

      # ── 18. UPLOAD PCK COMO ARTIFACT ───────────────────────────────
      - name: Upload PCK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: axev-crime-godot-pck
          path: build/pck/axev_crime.pck
          retention-days: 14
          if-no-files-found: error

      # ── 19. LOGS SEMPRE GUARDADOS ───────────────────────────────────
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-export-logs
          path: |
            /tmp/godot_import.log
            /tmp/godot_android_export.log
            /tmp/godot_pck_export.log
            /tmp/sdkmanager_install.log
          retention-days: 7
          if-no-files-found: ignore

      # ── 20. SUMÁRIO ────────────────────────────────────────────────
      - name: Sumário da exportação
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  AXEV CRIME — Android Debug Build"
          echo "  Personagem: The_Soldier.glb"
          echo "  Godot:  4.3-stable | SDK: API 34 | NDK: $ANDROID_NDK_ROOT"
          echo ""
          if [[ -f "build/android/axev_crime.apk" ]]; then
            echo "  APK : ✓ GERADO  ($(du -sh build/android/axev_crime.apk | cut -f1))"
          else
            echo "  APK : ✗ NÃO GERADO"
          fi
          if [[ -f "build/pck/axev_crime.pck" ]]; then
            echo "  PCK : ✓ GERADO  ($(du -sh build/pck/axev_crime.pck | cut -f1))"
          else
            echo "  PCK : ✗ NÃO GERADO"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
