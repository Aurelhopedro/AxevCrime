name: Build Android APK (Debug)

# ── EXECUÇÃO APENAS MANUAL ─────────────────────────────────────────
# Nunca executa automaticamente em push ou pull_request.
# Para executar: GitHub → Actions → Build Android APK (Debug) → Run workflow
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Godot 4.3 — Android Debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # ── 1. CHECKOUT ────────────────────────────────────────────────
      - name: Checkout repositório
        uses: actions/checkout@v4

      # ── 2. JAVA 17 ─────────────────────────────────────────────────
      # ubuntu-22.04 inclui Java 17 por omissão; apenas confirmamos
      - name: Confirmar Java 17
        run: |
          java -version
          echo "JAVA_HOME: ${JAVA_HOME:-não definido}"
          JAVA_PATH="$(readlink -f "$(which java)")"
          JAVA_HOME_DETECTED="$(dirname "$(dirname "$JAVA_PATH")")"
          echo "JAVA_HOME_DETECTED=$JAVA_HOME_DETECTED" >> "$GITHUB_ENV"

      # ── 3. DEPENDÊNCIAS DO SISTEMA ─────────────────────────────────
      - name: Instalar dependências do sistema
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            wget unzip ca-certificates \
            libfontconfig1 libx11-6 libxext6 \
            libxrender1 libxi6 libxrandr2 \
            libxcursor1 libxinerama1 libgl1

      # ── 4. GODOT 4.3 ───────────────────────────────────────────────
      - name: Instalar Godot 4.3
        run: |
          set -euo pipefail
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 \
            /tmp/godot/Godot_v4.3-stable_linux.x86_64 \
            /usr/local/bin/godot
          godot --version

      # ── 5. TEMPLATES DE EXPORTAÇÃO GODOT 4.3 ───────────────────────
      - name: Instalar templates de exportação Godot 4.3
        run: |
          set -euo pipefail
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -O /tmp/templates.tpz
          mkdir -p /tmp/templates_extracted
          unzip -q /tmp/templates.tpz -d /tmp/templates_extracted
          TEMPLATE_SRC="$(find /tmp/templates_extracted -type d -name "templates" | head -1)"
          if [[ -z "$TEMPLATE_SRC" ]]; then
            echo "::error::Directório de templates não encontrado no arquivo"
            exit 1
          fi
          mkdir -p "$TEMPLATES_DIR"
          cp -r "$TEMPLATE_SRC"/. "$TEMPLATES_DIR/"
          echo "Templates instalados: $(ls "$TEMPLATES_DIR" | wc -l) ficheiros"
          echo "Ficheiros Android presentes:"
          ls "$TEMPLATES_DIR/" | grep -i android || echo "AVISO: nenhum ficheiro android encontrado"

      # ── 6. ANDROID SDK ─────────────────────────────────────────────
      # O runner ubuntu-22.04 já inclui o Android SDK pré-instalado.
      # Localizamos o sdkmanager e instalamos exactamente o que o Godot 4.3 requer.
      - name: Localizar e configurar Android SDK
        run: |
          set -euo pipefail

          # O runner ubuntu-22.04 tem o SDK aqui:
          CANDIDATE="/usr/local/lib/android/sdk"
          if [[ -d "$CANDIDATE" ]]; then
            export ANDROID_SDK_ROOT="$CANDIDATE"
            echo "SDK pré-instalado encontrado: $ANDROID_SDK_ROOT"
          else
            echo "::error::Android SDK não encontrado em $CANDIDATE"
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          # Localizar sdkmanager — pode estar em vários caminhos no runner
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT" -name "sdkmanager" 2>/dev/null | head -1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager não encontrado em $ANDROID_SDK_ROOT"
            find "$ANDROID_SDK_ROOT" -type f -name "*.sh" 2>/dev/null | head -10 || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "sdkmanager localizado: $SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Instalar componentes Android para Godot 4.3
        run: |
          set -euo pipefail

          # Aceitar licenças de forma não interactiva
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          # Componentes exactos exigidos pelo Godot 4.3:
          #   Build Tools 34.0.0  — para apksigner e aapt2
          #   Platform android-34 — API level 34
          #   NDK r23c (23.2.8568313) — versão testada com Godot 4.x
          echo "A instalar build-tools, platform e NDK..."
          yes | "$SDKMANAGER" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "ndk;23.2.8568313" \
            2>&1 | tail -10

          # Verificar NDK instalado
          ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/23.2.8568313"
          if [[ ! -d "$ANDROID_NDK_ROOT" ]]; then
            echo "::error::NDK 23.2.8568313 não foi instalado correctamente"
            echo "NDKs disponíveis:"
            ls "$ANDROID_SDK_ROOT/ndk/" 2>/dev/null || echo "(directório ndk vazio)"
            exit 1
          fi

          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK instalado: $ANDROID_NDK_ROOT"
          echo "Build Tools instaladas:"
          ls "$ANDROID_SDK_ROOT/build-tools/" 2>/dev/null

      # ── 7. KEYSTORE DE DEBUG ────────────────────────────────────────
      # Gerada apenas no runner, nunca vai ao repositório.
      # Credenciais de debug públicas e conhecidas (não são segredos).
      - name: Gerar keystore de debug temporária
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          KEYSTORE_PATH="$HOME/.android/debug.keystore"
          if [[ ! -f "$KEYSTORE_PATH" ]]; then
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Keystore de debug gerada: $KEYSTORE_PATH"
          else
            echo "Keystore de debug já existia: $KEYSTORE_PATH"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      # ── 8. CONFIGURAR KEYSTORE VIA VARIÁVEIS DE AMBIENTE ───────────
      # O Godot 4.3 lê nativamente estas variáveis de ambiente em modo headless,
      # evitando completamente o problema de editor_settings-4.tres com heredoc.
      # Fonte: https://docs.godotengine.org/en/4.3/tutorials/export/exporting_for_android.html
      - name: Configurar variáveis de ambiente para keystore Android
        run: |
          set -euo pipefail
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE_PATH"    >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"   >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"       >> "$GITHUB_ENV"
          echo "Variáveis de keystore configuradas."

      # ── 9. IMPORTAR RECURSOS DO PROJECTO ───────────────────────────
      - name: Importar recursos do projecto
        timeout-minutes: 5
        run: |
          set -euo pipefail
          timeout 180s godot \
            --headless \
            --editor \
            --path "$GITHUB_WORKSPACE" \
            --import \
            --quit 2>&1 | tee /tmp/godot_import.log
          status=${PIPESTATUS[0]}

          echo "--- Godot import log (últimas 20 linhas) ---"
          tail -20 /tmp/godot_import.log

          if grep -Eiq \
            '(^ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource)' \
            /tmp/godot_import.log; then
            echo "::warning::Erros detectados durante o import — a continuar"
          fi

          echo "Import concluído (exit: $status)"

      # ── 10. EXPORTAR ANDROID DEBUG APK ─────────────────────────────
      - name: Exportar Android Debug APK
        timeout-minutes: 20
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ env.GODOT_ANDROID_KEYSTORE_DEBUG_PATH }}
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: ${{ env.GODOT_ANDROID_KEYSTORE_DEBUG_USER }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: ${{ env.GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p build/android

          echo "SDK:  $ANDROID_SDK_ROOT"
          echo "NDK:  $ANDROID_NDK_ROOT"
          echo "JDK:  $JAVA_HOME_DETECTED"
          echo "KS:   $GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          echo ""
          echo "A iniciar exportação Android Debug..."

          timeout 900s godot \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android" \
            "build/android/axev_crime.apk" \
            2>&1 | tee /tmp/godot_android_export.log
          status=${PIPESTATUS[0]}

          echo ""
          echo "--- Godot Android export log (últimas 60 linhas) ---"
          tail -60 /tmp/godot_android_export.log

          if [[ "$status" -ne 0 ]]; then
            echo "::error::Exportação Android falhou com exit code $status"
            echo "--- Log completo ---"
            cat /tmp/godot_android_export.log
            exit 1
          fi

          echo "Exportação Android concluída (exit: $status)."

      # ── 11. VERIFICAR APK — confirmar antes de declarar sucesso ────
      - name: Verificar APK gerado
        run: |
          set -euo pipefail

          APK="build/android/axev_crime.apk"

          if [[ ! -f "$APK" ]]; then
            echo "::error::APK não encontrado em $APK"
            echo "Conteúdo de build/android/:"
            ls -lh build/android/ 2>/dev/null || echo "(directório vazio ou inexistente)"
            exit 1
          fi

          APK_SIZE=$(wc -c < "$APK")
          if [[ "$APK_SIZE" -lt 1000 ]]; then
            echo "::error::APK existe mas tem apenas $APK_SIZE bytes — provavelmente vazio ou corrompido"
            exit 1
          fi

          # Um APK é um ZIP — deve começar com magic bytes PK (0x50 0x4B)
          HEX_MAGIC=$(xxd -l 2 -p "$APK")
          if [[ "$HEX_MAGIC" != "504b" ]]; then
            echo "::error::O ficheiro não é um ZIP/APK válido (magic: $HEX_MAGIC, esperado: 504b)"
            exit 1
          fi

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  APK VERIFICADO COM SUCESSO"
          echo "  Caminho:  $APK"
          echo "  Tamanho:  $(du -sh "$APK" | cut -f1) ($APK_SIZE bytes)"
          echo "  Magic:    $HEX_MAGIC (ZIP válido)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ── 12. UPLOAD DO APK COMO ARTIFACT DESCARREGÁVEL ──────────────
      - name: Upload APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: axev-crime-android-debug
          path: build/android/axev_crime.apk
          retention-days: 14
          if-no-files-found: error

      # ── 13. LOGS SEMPRE GUARDADOS (mesmo em falha) ─────────────────
      - name: Upload logs de exportação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-export-logs
          path: |
            /tmp/godot_import.log
            /tmp/godot_android_export.log
          retention-days: 7
          if-no-files-found: ignore

      # ── 14. SUMÁRIO FINAL ──────────────────────────────────────────
      - name: Sumário da exportação
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  AXEV CRIME — Android Debug Build"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Godot:       4.3-stable"
          echo "  Plataforma:  Android arm64-v8a"
          echo "  SDK:         API 34 / Build Tools 34.0.0"
          echo "  NDK:         r23c (23.2.8568313)"
          echo "  Assinatura:  debug keystore (gerada no runner)"
          echo "  APK:         build/android/axev_crime.apk"
          echo ""
          if [[ -f "build/android/axev_crime.apk" ]]; then
            echo "  RESULTADO:   ✓ APK GERADO"
            echo "  Tamanho:     $(du -sh build/android/axev_crime.apk | cut -f1)"
          else
            echo "  RESULTADO:   ✗ APK NÃO GERADO"
          fi
          echo ""
          echo "  Para instalar:"
          echo "  1. Descarregar artifact 'axev-crime-android-debug'"
          echo "  2. Activar 'Origens desconhecidas' nas definições Android"
          echo "  3. Instalar o APK directamente"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
