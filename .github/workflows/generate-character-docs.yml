          wc -c /tmp/SOLDIER_REFERENCE.md /tmp/SOLDIER_MODIFICATION_GUIDE.md

      # ── 8. COMMIT AO REPO (opcional) ──────────────────────────────
      - name: Commit dos ficheiros ao repositório (opcional)
        if: github.event.inputs.commit_docs == 'true'
        run: |
          cp /tmp/SOLDIER_REFERENCE.md docs/SOLDIER_REFERENCE.md
          cp /tmp/SOLDIER_MODIFICATION_GUIDE.md docs/SOLDIER_MODIFICATION_GUIDE.md

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p docs
          git add docs/SOLDIER_REFERENCE.md docs/SOLDIER_MODIFICATION_GUIDE.md

          if git diff --cached --quiet; then
            echo "Sem alterações para commitar (ficheiros idênticos)."
          else
            git commit -m "docs: actualizar SOLDIER_REFERENCE e SOLDIER_MODIFICATION_GUIDE [auto]"
            git push
            echo "✓ Ficheiros committed e pushed para o repositório."
          fi

      # ── 9. UPLOAD COMO ARTIFACT ────────────────────────────────────
      - name: Upload dos documentos como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soldier-character-docs
          path: |
            /tmp/SOLDIER_REFERENCE.md
            /tmp/SOLDIER_MODIFICATION_GUIDE.md
          retention-days: 90
          if-no-files-found: error

      # ── 10. SUMÁRIO FINAL ─────────────────────────────────────────
      - name: Sumário final
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  AXEV CRIME — Documentação do Personagem"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "  Ficheiros gerados:"
          echo "  • SOLDIER_REFERENCE.md"
          echo "    Referência técnica completa: skeleton, animações (nomes exactos),"
          echo "    integração Godot, fluxo de estados, root motion, bones."
          echo ""
          echo "  • SOLDIER_MODIFICATION_GUIDE.md"
          echo "    Guia de modificação: Blender, Mixamo, re-exportação,"
          echo "    materiais, bones em runtime, checklist de segurança."
          echo ""
          echo "  Download: separador Actions → este workflow → Artifacts"
          echo "  → soldier-character-docs"
          echo ""
          if [[ "${{ github.event.inputs.commit_docs }}" == "true" ]]; then
            echo "  Committed em: docs/SOLDIER_REFERENCE.md"
            echo "             e: docs/SOLDIER_MODIFICATION_GUIDE.md"
          else
            echo "  Para commitar ao repo: re-executar com 'commit_docs = true'"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
