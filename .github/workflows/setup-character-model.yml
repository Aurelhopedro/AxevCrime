name: Setup Quaternius Character Assets

## ============================================================================
## AXEV CRIME — Setup Quaternius Character Assets
## ============================================================================
##
## FONTES CC0 VERIFICADAS:
##
##   animations.glb  — Universal Animation Library 1 (Standard, CC0)
##     Fonte:  OpenGameArt.org — subido pelo próprio Quaternius
##     URL download directo (sem auth): sim
##
##   character.glb   — Universal Base Characters (Standard, CC0)
##     Fonte:  GitHub Release "assets-v1" deste repositório
##     Motivo: itch.io usa URLs assinados temporários (60s) com auth obrigatória.
##             Download automático directo do itch.io é impossível sem credenciais.
##
## COMO USAR:
##   Apenas corre o workflow. As animações são descarregadas automaticamente.
##   Para o personagem, segue as instruções nos logs se ainda não fizeste upload.
## ============================================================================

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-assets:
    name: Download & Commit Quaternius CC0 Assets
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      # ── 1. CHECKOUT ────────────────────────────────────────────────
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. CRIAR PASTA DE DESTINO ──────────────────────────────────
      - name: Criar pasta de destino
        run: mkdir -p assets/models/character

      # ── 3. ANIMAÇÕES — OpenGameArt (download directo, CC0, sem auth) ──
      - name: Descarregar Universal Animation Library 1 (Standard, CC0)
        run: |
          set -euo pipefail

          ANIM_URL="https://opengameart.org/sites/default/files/universal_animation_librarystandard.zip"
          ANIM_ZIP="/tmp/anim_standard.zip"
          ANIM_EXTRACT="/tmp/anim_extracted"

          echo "Fonte: OpenGameArt.org (Quaternius, CC0)"
          echo "URL:   $ANIM_URL"

          HTTP_CODE=$(curl -L -o "$ANIM_ZIP" -w "%{http_code}" \
            --retry 3 --retry-delay 5 \
            -H "User-Agent: Mozilla/5.0 (GitHub Actions; AxevCrime setup)" \
            "$ANIM_URL")

          if [[ "$HTTP_CODE" -ne 200 ]]; then
            echo "::error::Download das animações falhou (HTTP $HTTP_CODE)"
            echo "Alternativa: https://opengameart.org/content/universal-animation-library"
            exit 1
          fi

          echo "ZIP descarregado: $(du -sh "$ANIM_ZIP" | cut -f1)"

          HEX=$(xxd -l 2 -p "$ANIM_ZIP")
          if [[ "$HEX" != "504b" ]]; then
            echo "::error::Ficheiro não é ZIP válido (magic: $HEX)"
            exit 1
          fi

          mkdir -p "$ANIM_EXTRACT"
          unzip -q "$ANIM_ZIP" -d "$ANIM_EXTRACT"
          echo "GLBs no ZIP:"
          find "$ANIM_EXTRACT" -name "*.glb" | head -20

      - name: Localizar e copiar GLB de animações (Godot Standard)
        run: |
          set -euo pipefail

          ANIM_EXTRACT="/tmp/anim_extracted"
          GLB_PATH=""

          GLB_PATH=$(find "$ANIM_EXTRACT" -path "*/Godot/*Standard*.glb" | head -1 || true)
          if [[ -z "$GLB_PATH" ]]; then
            GLB_PATH=$(find "$ANIM_EXTRACT" -path "*/Godot/*.glb" -not -name "*RootMotion*" | head -1 || true)
          fi
          if [[ -z "$GLB_PATH" ]]; then
            GLB_PATH=$(find "$ANIM_EXTRACT" -name "*.glb" -not -name "*RootMotion*" -not -name "*rootmotion*" | head -1 || true)
          fi
          if [[ -z "$GLB_PATH" ]]; then
            GLB_PATH=$(find "$ANIM_EXTRACT" -name "*.glb" | head -1 || true)
          fi

          if [[ -z "$GLB_PATH" ]]; then
            echo "::error::Nenhum .glb encontrado no ZIP das animações"
            find "$ANIM_EXTRACT" | head -40
            exit 1
          fi

          echo "GLB encontrado: $GLB_PATH ($(du -sh "$GLB_PATH" | cut -f1))"
          cp "$GLB_PATH" assets/models/character/animations.glb

          SHA256=$(sha256sum assets/models/character/animations.glb | cut -d' ' -f1)
          echo "SHA-256 animations.glb: $SHA256"
          echo "ANIM_SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "ANIM_SOURCE_FILE=$(basename "$GLB_PATH")" >> "$GITHUB_ENV"
          echo "✓ animations.glb pronto"

      # ── 4. PERSONAGEM — GitHub Release (único método legítimo no CI) ──
      - name: Descarregar character.glb de GitHub Release
        id: download_character
        run: |
          set -euo pipefail

          CHAR_DEST="assets/models/character/character.glb"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/assets-v1/character.glb"

          echo "A tentar: $RELEASE_URL"

          HTTP_CODE=$(curl -L -o "$CHAR_DEST" -w "%{http_code}" \
            --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "User-Agent: GitHub-Actions-AxevCrime" \
            "$RELEASE_URL" 2>/dev/null || echo "000")

          if [[ "$HTTP_CODE" -eq 200 ]]; then
            CHAR_SIZE=$(wc -c < "$CHAR_DEST")
            if [[ "$CHAR_SIZE" -lt 10000 ]]; then
              echo "::warning::character.glb tem $CHAR_SIZE bytes — parece inválido"
              rm -f "$CHAR_DEST"
              echo "character_ok=false" >> "$GITHUB_OUTPUT"
            else
              HEX=$(xxd -l 4 -p "$CHAR_DEST")
              if [[ "$HEX" == "676c5446" ]]; then
                echo "✓ character.glb válido ($(du -sh "$CHAR_DEST" | cut -f1))"
                SHA256=$(sha256sum "$CHAR_DEST" | cut -d' ' -f1)
                echo "SHA-256 character.glb: $SHA256"
                echo "CHAR_SHA256=$SHA256" >> "$GITHUB_ENV"
                echo "character_ok=true" >> "$GITHUB_OUTPUT"
              else
                echo "::warning::character.glb não tem magic GLB correcto ($HEX)"
                rm -f "$CHAR_DEST"
                echo "character_ok=false" >> "$GITHUB_OUTPUT"
              fi
            fi
          else
            echo "character.glb não encontrado em Release assets-v1 (HTTP $HTTP_CODE)"
            echo "character_ok=false" >> "$GITHUB_OUTPUT"
            rm -f "$CHAR_DEST" 2>/dev/null || true
          fi

      - name: INSTRUÇÕES se character.glb está ausente
        if: steps.download_character.outputs.character_ok != 'true'
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ACÇÃO MANUAL NECESSÁRIA PARA O PERSONAGEM 3D"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "  O itch.io usa URLs assinados temporários que requerem sessão"
          echo "  autenticada. Download automático sem credenciais é impossível"
          echo "  sem violar os ToS do itch.io."
          echo ""
          echo "  PASSOS (uma vez):"
          echo "  1. Vai a: https://quaternius.itch.io/universal-base-characters"
          echo "     → 'Download Now' (gratuito, CC0)"
          echo "     → Descarrega: 'Universal Base Characters[Standard].zip'"
          echo ""
          echo "  2. Extrai: UniversalBaseCharacters[Standard]/Godot/Male_Regular.glb"
          echo ""
          echo "  3. GitHub deste repo → Releases → 'Create a new release'"
          echo "     → Tag: assets-v1"
          echo "     → Title: Quaternius Assets CC0"
          echo "     → Anexa Male_Regular.glb com o nome: character.glb"
          echo "     → Publica"
          echo ""
          echo "  4. Volta a correr este workflow"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "  NOTA: As ANIMAÇÕES foram descarregadas com sucesso."
          echo "  O jogo funciona sem o personagem (invisível, lógica intacta)."
          echo ""

      # ── 5. LICENÇA E REGISTO DE ORIGEM ─────────────────────────────
      - name: Criar LICENSE_CC0.txt e ORIGINS.md
        run: |
          cat > assets/models/character/LICENSE_CC0.txt << 'LICENSEEOF'
          LICENÇA DOS ASSETS 3D — AXEV CRIME
          ====================================

          Os ficheiros nesta pasta são propriedade do autor Quaternius,
          disponibilizados sob Creative Commons Zero v1.0 Universal (CC0).
          https://creativecommons.org/publicdomain/zero/1.0/

          Uso livre em projectos pessoais, educacionais e comerciais.
          Sem necessidade de atribuição. Sem restrições.

          AUTOR: Quaternius — https://quaternius.com

            character.glb  — Universal Base Characters (Standard, CC0)
              https://quaternius.itch.io/universal-base-characters

            animations.glb — Universal Animation Library 1 (Standard, CC0)
              https://opengameart.org/content/universal-animation-library
              https://quaternius.itch.io/universal-animation-library
          LICENSEEOF

          TIMESTAMP=$(date -u "+%Y-%m-%dT%H:%M:%SZ")
          CHAR_STATUS="AUSENTE — ver logs do workflow"
          if [[ -f "assets/models/character/character.glb" ]]; then
            CHAR_STATUS="PRESENTE — $(du -sh assets/models/character/character.glb | cut -f1), SHA-256: ${CHAR_SHA256:-n/a}"
          fi

          cat > assets/models/character/ORIGINS.md << ORIGINSEOF
          # Registo de Origem dos Assets — AXEV CRIME

          Gerado por: .github/workflows/setup-character-model.yml
          Data: ${TIMESTAMP}
          Commit: ${{ github.sha }}

          ## animations.glb — Universal Animation Library 1 (Standard)

          | Campo | Valor |
          |---|---|
          | Autor | Quaternius |
          | Licença | CC0 Creative Commons Zero v1.0 |
          | Fonte primária | https://quaternius.itch.io/universal-animation-library |
          | Espelho CI | https://opengameart.org/content/universal-animation-library |
          | Ficheiro no ZIP | ${ANIM_SOURCE_FILE:-AnimationLibrary_Godot_Standard.glb} |
          | SHA-256 | ${ANIM_SHA256:-não calculado} |
          | Download automático | ✅ Sim (OpenGameArt, sem autenticação) |

          ## character.glb — Universal Base Characters (Male Regular)

          | Campo | Valor |
          |---|---|
          | Autor | Quaternius |
          | Licença | CC0 Creative Commons Zero v1.0 |
          | Fonte | https://quaternius.itch.io/universal-base-characters |
          | Ficheiro no ZIP | Godot/Male_Regular.glb |
          | Método de CI | GitHub Release deste repositório (tag: assets-v1) |
          | Download automático | ❌ Não (itch.io requer sessão autenticada) |
          | Status | ${CHAR_STATUS} |
          ORIGINSEOF

          echo "✓ LICENSE_CC0.txt e ORIGINS.md criados."

      # ── 6. VERIFICAÇÃO FINAL ────────────────────────────────────────
      - name: Verificar ficheiros finais
        run: |
          echo "=== assets/models/character/ ==="
          ls -lh assets/models/character/

          echo ""
          for f in character.glb animations.glb; do
            if [[ -f "assets/models/character/$f" ]]; then
              HEX=$(xxd -l 4 -p "assets/models/character/$f")
              if [[ "$HEX" == "676c5446" ]]; then
                echo "✓ $f — GLB válido"
              else
                echo "✗ $f — magic inválido: $HEX"
              fi
            else
              echo "⚠ $f — AUSENTE"
            fi
          done

      # ── 7. COMMIT ──────────────────────────────────────────────────
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/models/character/

          if git diff --cached --quiet; then
            echo "Sem alterações para commitar."
          else
            ANIM_INFO="$(du -sh assets/models/character/animations.glb 2>/dev/null | cut -f1 || echo 'ausente')"
            CHAR_INFO="$(du -sh assets/models/character/character.glb 2>/dev/null | cut -f1 || echo 'ausente')"
            git commit -m "feat(assets): Quaternius CC0 — animations ${ANIM_INFO}, character ${CHAR_INFO}

          animations.glb: OpenGameArt.org (Universal Animation Library 1 Standard)
          character.glb:  GitHub Release assets-v1 (Universal Base Characters Standard)
          Licença: CC0 Creative Commons Zero v1.0 Universal
          Registo: assets/models/character/ORIGINS.md"
            git push
            echo "✓ Push realizado."
          fi

      # ── 8. SUMÁRIO ─────────────────────────────────────────────────
      - name: Sumário
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  AXEV CRIME — Quaternius Assets Setup"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [[ -f "assets/models/character/animations.glb" ]]; then
            echo "  animations.glb : ✅ $(du -sh assets/models/character/animations.glb | cut -f1)"
          else
            echo "  animations.glb : ❌ AUSENTE"
          fi
          if [[ -f "assets/models/character/character.glb" ]]; then
            echo "  character.glb  : ✅ $(du -sh assets/models/character/character.glb | cut -f1)"
          else
            echo "  character.glb  : ⚠️  AUSENTE — acção manual necessária"
          fi
          echo "  Licença        : CC0 — domínio público"
          echo "  Registo        : assets/models/character/ORIGINS.md"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
