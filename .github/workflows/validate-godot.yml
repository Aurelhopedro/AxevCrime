name: Validate Godot Project

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Godot 4.3 Headless Validation
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            wget unzip ca-certificates \
            libfontconfig1 libx11-6 libxext6 \
            libxrender1 libxi6 libxrandr2 \
            libxcursor1 libxinerama1 libgl1

      - name: Install Godot 4.3
        run: |
          set -euo pipefail

          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            -O /tmp/godot.zip

          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 \
            /tmp/godot/Godot_v4.3-stable_linux.x86_64 \
            /usr/local/bin/godot

          godot --version

      - name: Install Godot 4.3 export templates
        run: |
          set -euo pipefail

          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"

          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -O /tmp/templates.tpz

          mkdir -p /tmp/templates_extracted
          unzip -q /tmp/templates.tpz -d /tmp/templates_extracted

          TEMPLATE_SRC=$(find /tmp/templates_extracted -type d -name "templates" | head -1)

          if [[ -z "$TEMPLATE_SRC" ]]; then
            echo "::error::Could not locate templates directory inside archive"
            exit 1
          fi

          mkdir -p "$TEMPLATES_DIR"
          cp -r "$TEMPLATE_SRC"/. "$TEMPLATES_DIR/"

          echo "Templates installed to: $TEMPLATES_DIR"
          ls -lh "$TEMPLATES_DIR/" | grep web || echo "(no web files found)"

      - name: Verify Web export templates
        run: |
          set -euo pipefail

          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"

          required_templates=(
            "web_nothreads_debug.zip"
            "web_nothreads_release.zip"
          )

          for tpl in "${required_templates[@]}"; do
            if [[ ! -f "$TEMPLATES_DIR/$tpl" ]]; then
              echo "::error::Required Web export template missing: $TEMPLATES_DIR/$tpl"
              echo "Available files:"
              ls "$TEMPLATES_DIR/" || echo "(directory empty or missing)"
              exit 1
            fi
            echo "OK: $tpl"
          done

          echo "Web export templates verified."

      - name: Verify required files
        run: |
          set -euo pipefail

          required_files=(
            "project.godot"
            "export_presets.cfg"
            "scenes/main.tscn"
            "scenes/player.tscn"
            "scripts/main.gd"
            "scripts/player_controller.gd"
            "assets/icon.svg"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file missing: $file"
              exit 1
            fi
            echo "OK: $file"
          done

      # ── VALIDAÇÃO HEADLESS ─────────────────────────────────────────

      - name: Import project resources
        timeout-minutes: 5
        run: |
          set -euo pipefail

          timeout 180s godot \
            --headless \
            --editor \
            --path "$GITHUB_WORKSPACE" \
            --import \
            --quit 2>&1 | tee /tmp/godot_import.log
          status=${PIPESTATUS[0]}

          if [[ "$status" -ne 0 ]]; then
            echo "::error::Godot import failed with exit code $status"
            exit 1
          fi

          if grep -Eiq \
            '(^ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource)' \
            /tmp/godot_import.log; then
            echo "::error::Errors detected during resource import"
            exit 1
          fi

          echo "Resource import completed without detected critical errors."

      - name: Start main scene headlessly
        timeout-minutes: 2
        run: |
          set -euo pipefail

          timeout 30s godot \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --fixed-fps 10 \
            --quit-after 60 2>&1 | tee /tmp/godot_startup.log
          status=${PIPESTATUS[0]}

          if [[ "$status" -ne 0 ]]; then
            echo "::error::Main scene startup failed with exit code $status"
            exit 1
          fi

          if grep -Eiq \
            '(^ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource)' \
            /tmp/godot_startup.log; then
            echo "::error::Errors detected during main scene startup"
            exit 1
          fi

          echo "Main scene startup test completed without detected critical errors."

      # ── EXPORTAÇÃO WEB ─────────────────────────────────────────────

      - name: Export project to Web
        timeout-minutes: 10
        run: |
          set -euo pipefail

          mkdir -p build/web

          timeout 300s godot \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-release "Web" \
            "build/web/index.html" 2>&1 | tee /tmp/godot_export.log
          status=${PIPESTATUS[0]}

          if grep -Eiq \
            '(^ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource)' \
            /tmp/godot_export.log; then
            echo "::error::Errors detected during Web export"
            exit 1
          fi

          if [[ "$status" -ne 0 ]]; then
            echo "::error::Web export failed with exit code $status"
            exit 1
          fi

          echo "Web export completed."

      - name: Verify Web export output
        run: |
          set -euo pipefail

          if [[ ! -f "build/web/index.html" ]]; then
            echo "::error::build/web/index.html not found — export did not produce output"
            exit 1
          fi

          if [[ ! -s "build/web/index.html" ]]; then
            echo "::error::build/web/index.html is empty"
            exit 1
          fi

          echo "OK: build/web/index.html ($(wc -c < build/web/index.html) bytes)"

          echo "--- Web export directory contents ---"
          ls -lh build/web/

          echo "Web export verification passed."

      - name: Upload Web export artefact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: axev-crime-web-export
          path: build/web/
          retention-days: 7

      # ── PUBLICAÇÃO VERCEL (condicional — requer VERCEL_TOKEN) ───────

      - name: Deploy to Vercel
        if: github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_d9e3cG3agie2arGYiSLU4Ews
          VERCEL_PROJECT_ID: prj_yVmlCjThD82Qj1vJvgvOxC9dqmMa
        run: |
          set -euo pipefail

          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "VERCEL_TOKEN not configured — skipping deployment."
            exit 0
          fi

          npm install -g vercel@latest --quiet

          vercel deploy build/web \
            --token "$VERCEL_TOKEN" \
            --project 20jogo \
            --yes \
            --prod 2>&1 | tee /tmp/vercel_deploy.log

          echo "Deployment to Vercel completed."

      # ── SUMÁRIO ────────────────────────────────────────────────────

      - name: Validation and export summary
        if: success()
        run: |
          echo "AXEV CRIME — workflow completed."
          echo "Godot version:        4.3-stable"
          echo "Resource import:      passed"
          echo "Main scene startup:   passed"
          echo "Web export:           passed"
          echo "build/web/index.html: present"
          if [[ -n "${VERCEL_TOKEN:-}" ]]; then
            echo "Vercel deployment:    executed"
          else
            echo "Vercel deployment:    skipped (VERCEL_TOKEN not configured)"
          fi
